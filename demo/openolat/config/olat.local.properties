# OpenOLAT local config for the Ed4All retrieval-demo shell.
# Loaded from the common classpath (${catalina.base}/lib/olat.local.properties).
#
# NOT SECRET-BEARING beyond the demo Postgres password, which is also the
# compose default and is only reachable on the private compose network. The
# OpenOLAT admin login (administrator / openolat, the product default) is NOT
# set here — it is auto-created on first boot against the empty schema. CHANGE
# IT before any exposure; see RUNBOOK.md § "Credentials".

# --- Database: JNDI DataSource declared in conf/Catalina/localhost/openolat.xml
db.source=jndi
db.jndi=java:comp/env/jdbc/openolatDS
db.vendor=postgresql
# db.host/name/user/pass are unused in jndi mode (the URL lives in the context
# descriptor) but OpenOLAT still reads db.vendor for dialect selection.
db.name=oodb
db.user=oodbu
db.pass=oodbpasswd

# --- Paths
installation.dir=/opt/openolat
userdata.dir=/opt/openolat/olatdata
log.dir=/opt/openolat/logs

# --- Server identity / URL generation
# Deployed at context /openolat; browser reaches it at http://<host>:8080/openolat
server.contextpath=/openolat
server.domainname=localhost
server.port=8080
server.port.ssl=0
server.insecure.cookie=true
smtp.host=disabled
tomcat.id=1
instance.id=ed4alldemo
auto.upgrade.database=true
olat.debug=false
localization.cache=true
user.generateTestUsers=false

# --- REST API: enable so demo/openolat/provision.py can create the course,
# learner and embed element over HTTP basic auth. (Admin can also toggle this
# at runtime under Administration > Core configuration > REST API.)
restapi.enable=true
restapi.cors.enable=false
