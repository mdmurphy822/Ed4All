# Courseforge two-pass router block-routing policy.
#
# Schema: schemas/courseforge/block_routing.schema.json
# Loader: Courseforge/router/policy.py::load_block_routing_policy
# Consumer: Courseforge/router/router.py::CourseforgeRouter._resolve_spec
#
# Resolution priority: per-call kwargs > this YAML > tier-default env vars
# (COURSEFORGE_OUTLINE_PROVIDER / COURSEFORGE_OUTLINE_MODEL /
# COURSEFORGE_REWRITE_PROVIDER / COURSEFORGE_REWRITE_MODEL) > the hardcoded
# defaults table.
#
# Override the path to this file via COURSEFORGE_BLOCK_ROUTING_PATH.
# Deleting the file or pointing the env var at a missing path is the
# supported "no operator overrides" mode — the loader returns an
# empty policy and the router walks straight through to env vars +
# hardcoded defaults.
#
# ----------------------------------------------------------------------
# Capability-tier abstraction
# ----------------------------------------------------------------------
#
# `capability_tiers` is an OPERATOR-OWNED table mapping symbolic tier
# names to provider/model/sampling specs. Per-block-type entries below
# reference these tiers via `capability_tier: <name>` instead of
# pinning a vendor or model literal in the block-type entry. List form
# (`capability_tier: [small, medium]`) enables cascading regeneration:
# attempts at the lower tier exhaust the per-tier sub-budget, then the
# router escalates to the next tier with no code change.
#
# Operators swapping deployments (Qwen-only → Llama-only, or local →
# Together → cloud) edit only this `capability_tiers` table — every
# per-block-type entry below survives the swap.

version: 1

capability_tiers:
  # Small tier — fast, cheap, structurally-shaped first-draft work.
  # A 7B-class local model is the typical fit for outline tiers.
  small:
    provider: local
    model: qwen2.5:7b-instruct-q4_K_M
    base_url: http://localhost:11434/v1
    temperature: 0.0
    max_tokens: 1200

  # Medium tier — pedagogically-rich rewrite of structurally-shaped
  # outlines. A 7B local model handles most rewrite-tier blocks
  # acceptably; pedagogy-critical blocks (assessment_item) prefer the
  # large tier below.
  medium:
    provider: local
    model: qwen2.5:7b-instruct-q4_K_M
    base_url: http://localhost:11434/v1
    temperature: 0.4
    max_tokens: 2400

  # Large tier — multi-step-reasoning workloads (assessment-item
  # distractors, prereq-chain reasoning). Operators who want a
  # license-clean alternative swap this entry to a 32B local model or a
  # Together OSS model — no code change needed.
  large:
    provider: anthropic
    model: claude-sonnet-4-6
    temperature: 0.4
    max_tokens: 2400

defaults:
  outline:
    capability_tier: small
  rewrite:
    capability_tier: medium

blocks:
  # ----------------------------------------------------------------------
  # Per-block-type validator matrix
  # ----------------------------------------------------------------------
  #
  # Every entry in Courseforge/scripts/blocks.py::BLOCK_TYPES (canonical
  # 24-value frozenset) MUST carry a ``validators`` block; the
  # completeness regression at
  # Courseforge/router/tests/test_block_type_gate_matrix.py asserts
  # this. Dropping a block_type from the matrix below fails the gate at
  # load time.
  #
  # Resolution semantics (consumed by
  # CourseforgeRouter._dispatch_validation_chain):
  #   - ``required[]``: gate_ids that MUST pass; failure triggers
  #     ``fail_action`` against the router's regen / escalate / block
  #     loop control.
  #   - ``optional[]``: gate_ids that are advisory; failure emits a
  #     warning but never short-circuits the router.
  #   - any global gate not listed in EITHER array is skipped silently
  #     for this block_type.
  # Backward-compat: a block_type without a ``validators`` block (e.g.
  # an out-of-tree YAML file) falls through to the legacy "all gates
  # run" behavior at the dispatcher layer.

  # assessment_item: pedagogy-critical. Outline starts at small tier;
  # rewrite escalates from medium to large on per-tier sub-budget
  # exhaustion. The list form is the operator-facing dial: a deployment
  # running only Qwen variants repoints the `large` tier above and the
  # cascade still works.
  assessment_item:
    outline:
      capability_tier: small
    rewrite:
      capability_tier: [medium, large]
    validators:
      required:
        - objective_assessment_similarity
        - bloom_alignment
        - answerability
        # Per-block synthesis-manifest RESOLUTION gate. Ships severity:
        # warning in config/workflows.yaml, so it does not block; listed here
        # so the router's per-type filter keeps the manifest gate in lockstep
        # with the validator skip set.
        - manifest_completeness
      optional:
        - distractor_entropy
      fail_action: escalate

  # concept: starts small for outline, lifts to medium for the
  # pedagogically-richer rewrite.
  concept:
    outline:
      capability_tier: small
    rewrite:
      capability_tier: medium
    validators:
      required:
        - source_ref
        - content_type
        - similarity
        - manifest_completeness   # warning-severity in workflows.yaml
      optional:
        - curie_anchoring
      fail_action: regenerate

  # example: same shape — concrete illustration is moderate-difficulty
  # for the rewrite tier.
  example:
    outline:
      capability_tier: small
    rewrite:
      capability_tier: medium
    validators:
      required:
        - concept_example_similarity
        - source_ref
        # Stub-example safety net. Without this entry the matrix filter
        # (_dispatch_validation_chain) silently DROPS
        # ExampleCompletenessValidator from the router's per-block
        # remediation chain, so a stubbed example (problem statement, no
        # worked solution) ships even though the validator returned
        # action="regenerate". Listing it required makes the router
        # re-roll the stub with the remediation directive appended.
        - example_completeness
        - manifest_completeness   # warning-severity in workflows.yaml
      optional:
        - bloom_classifier_disagreement
      fail_action: regenerate

  # misconception: the misconception statement + correction structure
  # benefits from the medium tier for nuanced authorial voice.
  misconception:
    outline:
      capability_tier: small
    rewrite:
      capability_tier: medium
    validators:
      required:
        - source_ref
        - distractor_misconception_alignment
        - manifest_completeness   # warning-severity in workflows.yaml
      optional: []
      fail_action: regenerate

  # summary_takeaway: bullet-list shape; medium tier is sufficient for
  # the synthesizing prose.
  summary_takeaway:
    outline:
      capability_tier: small
    rewrite:
      capability_tier: medium
    validators:
      required:
        - source_ref
        - manifest_completeness   # warning-severity in workflows.yaml
      optional: []
      fail_action: regenerate

  # flip_card_grid: structurally simple (term/definition pairs); the
  # local 7B model handles outline + rewrite acceptably.
  flip_card_grid:
    outline:
      capability_tier: small
    rewrite:
      capability_tier: small
    validators:
      required:
        - source_ref
        - content_type
        - manifest_completeness   # warning-severity in workflows.yaml
      optional: []
      fail_action: regenerate

  # prereq_set: the outline tier's structural contract (ordered list of
  # prereq concept refs) is something the 7B local model frequently
  # mis-shapes. Skip outline entirely and let rewrite author the block
  # from scratch with the enriched prompt.
  prereq_set:
    escalate_immediately: true
    validators:
      required:
        - source_ref
        - manifest_completeness   # warning-severity in workflows.yaml
      optional: []
      fail_action: regenerate

  # objective: canonical TO-NN / CO-NN learning objective. Source
  # grounding + CURIE anchoring drive the audit trail.
  #
  # Skips the outline tier. A local 7B or 14B model collapses the
  # objective block's structured JSON schema (block_id / block_type /
  # content_type / bloom_level / objective_refs / curies / key_claims)
  # down to the inner key_claims array, in both json_object and
  # json_schema grammar modes, so every objective block exhausts the
  # regen budget and inter-tier validation blocks rewrite. Raising the
  # regen budget does not help — the failure is the schema, not the
  # sampling. escalate_immediately lets rewrite author the block as HTML
  # from scratch, where no strict JSON schema applies (same reasoning as
  # prereq_set above).
  objective:
    escalate_immediately: true
    validators:
      required:
        - curie_anchoring
        - source_ref
      optional: []
      fail_action: regenerate

  # explanation: prose explanation block; source grounding + content-
  # type discriminator drive the gate. Similarity is advisory because
  # explanations are often paraphrased away from a single chunk.
  explanation:
    validators:
      required:
        - source_ref
        - content_type
        - manifest_completeness   # warning-severity in workflows.yaml
      optional:
        - similarity
      fail_action: regenerate

  # activity: hands-on practice block. Objective ref + source ref
  # required; accessibility (alt-text, contrast) is advisory until the
  # accessibility gate ships.
  activity:
    validators:
      required:
        - objective_ref
        - source_ref
        - manifest_completeness   # warning-severity in workflows.yaml
      optional:
        - accessibility
      fail_action: regenerate

  # callout: short note/warning/info block. Source grounding only —
  # callouts have no intrinsic Bloom level or objective ref.
  callout:
    validators:
      required:
        - source_ref
        - manifest_completeness   # warning-severity in workflows.yaml
      optional: []
      fail_action: regenerate

  # self_check_question: formative-assessment question; objective ref
  # + answerability required. Bloom classifier disagreement is
  # advisory because self-check Bloom is rarely structurally pinned.
  self_check_question:
    validators:
      required:
        - objective_ref
        - answerability
        - manifest_completeness   # warning-severity in workflows.yaml
      optional:
        - bloom_classifier_disagreement
      fail_action: escalate

  # reflection_prompt: open-ended journal prompt. Objective ref drives
  # the audit trail; reflection prompts are intentionally
  # non-grounded.
  reflection_prompt:
    validators:
      required:
        - objective_ref
        - manifest_completeness   # warning-severity in workflows.yaml
      optional: []
      fail_action: regenerate

  # discussion_prompt: peer-discussion prompt. Same shape as
  # reflection_prompt — objective-ref-anchored.
  discussion_prompt:
    validators:
      required:
        - objective_ref
        - manifest_completeness   # warning-severity in workflows.yaml
      optional: []
      fail_action: regenerate

  # chrome: page-level template chrome (header / footer / nav). No
  # pedagogical validators apply; the empty required list keeps the
  # dispatcher's filter inert for chrome blocks.
  chrome:
    validators:
      required: []
      optional: []
      fail_action: regenerate

  # recap: end-of-week summary. Source grounding required so the recap
  # is auditable back to the week's chunks.
  recap:
    validators:
      required:
        - source_ref
      optional: []
      fail_action: regenerate

  # ----------------------------------------------------------------------
  # Block-variety additions (scenario / problem / vocab_card / formula /
  # checklist). These must mirror Courseforge/router/policy.py
  # ::DEFAULT_BLOCK_ROUTING so the YAML matrix and the hardcoded fallback
  # agree (asserted by test_block_type_gate_matrix Test 5).
  # ----------------------------------------------------------------------

  # scenario: application / case scenario. Objective-anchored (the
  # scenario exercises a stated objective) and source-grounded.
  scenario:
    validators:
      required:
        - objective_ref
        - source_ref
      optional:
        - accessibility
      fail_action: regenerate

  # problem: practice problem with a no-JS reveal solution. Source
  # grounding required; Bloom dispersion advisory.
  problem:
    validators:
      required:
        - source_ref
      optional:
        - bloom_classifier_disagreement
      fail_action: regenerate

  # vocab_card: single domain term + definition. Source + content_type
  # required so the term is auditable and typed.
  vocab_card:
    validators:
      required:
        - source_ref
        - content_type
      optional: []
      fail_action: regenerate

  # formula: single highlighted formula + variable gloss. Source
  # grounding required.
  formula:
    validators:
      required:
        - source_ref
      optional: []
      fail_action: regenerate

  # checklist: actionable steps / criteria list. Source grounding
  # required so each item is auditable back to the source.
  checklist:
    validators:
      required:
        - source_ref
      optional: []
      fail_action: regenerate

  # ----------------------------------------------------------------------
  # Instruction-palette additions (table / acronym / key_idea). These must
  # mirror Courseforge/router/policy.py::DEFAULT_BLOCK_ROUTING so the YAML
  # matrix and the hardcoded fallback agree (asserted by
  # test_block_type_gate_matrix Test 5).
  # ----------------------------------------------------------------------

  # table: accessible comparison/tabular block. Source + content_type
  # required so the table is auditable and typed.
  table:
    validators:
      required:
        - source_ref
        - content_type
      optional: []
      fail_action: regenerate

  # acronym: letter→term mnemonic block. Source grounding required so the
  # expansion is auditable back to the source.
  acronym:
    validators:
      required:
        - source_ref
      optional: []
      fail_action: regenerate

  # key_idea: emphasized-principle aside. Source + content_type required.
  key_idea:
    validators:
      required:
        - source_ref
        - content_type
      optional: []
      fail_action: regenerate
