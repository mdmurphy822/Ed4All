# Courseforge two-pass router block-routing policy (Phase 3 + Qwen-7B
# capability_tier rewrite).
#
# Schema: schemas/courseforge/block_routing.schema.json
# Loader: Courseforge/router/policy.py::load_block_routing_policy
# Consumer: Courseforge/router/router.py::CourseforgeRouter._resolve_spec
#
# Resolution priority (Phase 3 §3.3): per-call kwargs > this YAML >
# tier-default env vars (COURSEFORGE_OUTLINE_PROVIDER /
# COURSEFORGE_OUTLINE_MODEL / COURSEFORGE_REWRITE_PROVIDER /
# COURSEFORGE_REWRITE_MODEL) > hardcoded defaults table.
#
# Override the path to this file via COURSEFORGE_BLOCK_ROUTING_PATH.
# Deleting the file or pointing the env var at a missing path is the
# supported "no operator overrides" mode — the loader returns an
# empty policy and the router walks straight through to env vars +
# hardcoded defaults.
#
# ----------------------------------------------------------------------
# Capability-tier abstraction (Qwen-7B audit plan §2 / §4)
# ----------------------------------------------------------------------
#
# `capability_tiers` is an OPERATOR-OWNED table mapping symbolic tier
# names to provider/model/sampling specs. Per-block-type entries below
# reference these tiers via `capability_tier: <name>` instead of
# pinning a vendor or model literal in the block-type entry. List form
# (`capability_tier: [small, medium]`) enables cascading-regen:
# attempts at the lower tier exhaust the per-tier sub-budget, then the
# router escalates to the next tier with no code change.
#
# Operators swapping deployments (Qwen-only → Llama-only, or local →
# Together → cloud) edit only this `capability_tiers` table — every
# per-block-type entry below survives the swap.

version: 1

capability_tiers:
  # Small tier — fast, cheap, structurally-shaped first-draft work.
  # The 7B-class local model is the typical fit for outline tiers.
  small:
    provider: local
    model: qwen2.5:7b-instruct-q4_K_M
    base_url: http://localhost:11434/v1
    temperature: 0.0
    max_tokens: 1200

  # Medium tier — pedagogically-rich rewrite of structurally-shaped
  # outlines. A 14B local model handles most rewrite-tier blocks at
  # consistently acceptable quality; pedagogy-critical blocks
  # (assessment_item) prefer the large tier below.
  medium:
    provider: local
    model: qwen2.5:14b-instruct-q4_K_M
    base_url: http://localhost:11434/v1
    temperature: 0.4
    max_tokens: 2400

  # Large tier — multi-step-reasoning workloads where the higher-
  # capability model noticeably improves emit quality (assessment-item
  # distractors, prereq-chain reasoning). Operators who want a
  # license-clean alternative swap this entry to a 32B local model
  # or a Together OSS model — no code change needed.
  large:
    provider: anthropic
    model: claude-sonnet-4-6
    temperature: 0.4
    max_tokens: 2400

defaults:
  outline:
    capability_tier: small
  rewrite:
    capability_tier: medium

blocks:
  # ----------------------------------------------------------------------
  # Per-block-type validator matrix (GPT Feedback v2 Wave 3 W3.C)
  # ----------------------------------------------------------------------
  #
  # Every entry in Courseforge/scripts/blocks.py::BLOCK_TYPES (canonical
  # 16-value frozenset) MUST carry a ``validators`` block; the
  # completeness regression at
  # Courseforge/router/tests/test_block_type_gate_matrix.py asserts
  # this. Dropping a block_type from the matrix below fails the gate at
  # load time.
  #
  # Resolution semantics (consumed by
  # CourseforgeRouter._dispatch_validation_chain):
  #   - ``required[]``: gate_ids that MUST pass; failure triggers
  #     ``fail_action`` against the router's regen / escalate / block
  #     loop control.
  #   - ``optional[]``: gate_ids that are advisory; failure emits a
  #     warning but never short-circuits the router.
  #   - any global gate not listed in EITHER array is skipped silently
  #     for this block_type.
  # Backward-compat: a block_type without a ``validators`` block (e.g.
  # an out-of-tree YAML file pre-Wave-3) falls through to the legacy
  # "all gates run" behavior at the dispatcher layer.

  # assessment_item: pedagogy-critical. Outline starts at small tier;
  # rewrite escalates from medium to large on per-tier sub-budget
  # exhaustion (cascading-regen — plan §4). The list form is the
  # operator-facing dial: a deployment running only Qwen variants
  # rewrites the `large` tier above to point at qwen2.5:32b and the
  # cascade still works.
  assessment_item:
    outline:
      capability_tier: small
    rewrite:
      capability_tier: [medium, large]
    validators:
      required:
        - objective_assessment_similarity
        - bloom_alignment
        - answerability
        # W3 §3.3 — per-block synthesis-manifest RESOLUTION gate. Non-blocking
        # day-1 (the gate ships severity: warning in config/workflows.yaml until
        # a live run proves the emission); listed here so the router's per-type
        # filter keeps the manifest gate in lockstep with the validator skip set.
        - manifest_completeness
      optional:
        - distractor_entropy
      fail_action: escalate

  # concept: starts small for outline, lifts to medium for the
  # pedagogically-richer rewrite. Plan §2.3 tested-block-type policy.
  concept:
    outline:
      capability_tier: small
    rewrite:
      capability_tier: medium
    validators:
      required:
        - source_ref
        - content_type
        - similarity
        - manifest_completeness   # W3 §3.3 (non-blocking day-1; warning in workflows.yaml)
      optional:
        - curie_anchoring
      fail_action: regenerate

  # example: same shape — concrete illustration is moderate-difficulty
  # for the rewrite tier.
  example:
    outline:
      capability_tier: small
    rewrite:
      capability_tier: medium
    validators:
      required:
        - concept_example_similarity
        - source_ref
        - manifest_completeness   # W3 §3.3 (non-blocking day-1; warning in workflows.yaml)
      optional:
        - bloom_classifier_disagreement
      fail_action: regenerate

  # misconception: the misconception statement + correction structure
  # benefits from the medium tier for nuanced authorial voice. Plan
  # §3.5's contextual CURIE gate keeps the rewrite from token-stuffing.
  misconception:
    outline:
      capability_tier: small
    rewrite:
      capability_tier: medium
    validators:
      required:
        - source_ref
        - distractor_misconception_alignment
        - manifest_completeness   # W3 §3.3 (non-blocking day-1; warning in workflows.yaml)
      optional: []
      fail_action: regenerate

  # summary_takeaway: bullet-list shape; medium tier is sufficient for
  # the synthesizing prose.
  summary_takeaway:
    outline:
      capability_tier: small
    rewrite:
      capability_tier: medium
    validators:
      required:
        - source_ref
        - manifest_completeness   # W3 §3.3 (non-blocking day-1; warning in workflows.yaml)
      optional: []
      fail_action: regenerate

  # flip_card_grid: structurally simple (term/definition pairs); the
  # local 7B model handles outline + rewrite at consistently acceptable
  # quality. Wave NN: provider-agnostic capability-tier (plan §2.3).
  flip_card_grid:
    outline:
      capability_tier: small
    rewrite:
      capability_tier: small
    validators:
      required:
        - source_ref
        - content_type
        - manifest_completeness   # W3 §3.3 (non-blocking day-1; warning in workflows.yaml)
      optional: []
      fail_action: regenerate

  # prereq_set: the outline tier's structural contract (ordered list of
  # prereq concept refs) is something the 7B local model frequently
  # mis-shapes. Skip outline entirely and let rewrite author the block
  # from scratch with the enriched prompt — see Subtask 42.
  prereq_set:
    escalate_immediately: true
    validators:
      required:
        - source_ref
        - manifest_completeness   # W3 §3.3 (non-blocking day-1; warning in workflows.yaml)
      optional: []
      fail_action: regenerate

  # objective: canonical TO-NN / CO-NN learning objective. Source
  # grounding + CURIE anchoring drive the audit trail.
  #
  # Wave 7: skip outline tier — Qwen 7B (small tier) consistently fails
  # the objective block's structured schema (block_id/block_type/
  # content_type/bloom_level/objective_refs/curies/key_claims), collapsing
  # the response to the inner key_claims array. On the 2026-05-13 dispatch
  # run, 28/28 objective blocks exhausted the regen budget at outline
  # tier; inter-tier validation correctly blocked rewrite. escalate_
  # immediately skips outline and lets rewrite (claude_session / Sonnet
  # per Wave 6) author the block from scratch — mirrors prereq_set above.
  #
  # 2026-05-14: Wave-7 policy reaffirmed. Tested Qwen 14B with both
  # json_object and json_schema grammar modes; both collapse the
  # objective block schema to the inner key_claims array (same failure
  # mode as 7B). Wave-7's escalate_immediately is the correct design —
  # let rewrite (Qwen 14B medium tier) author the block as HTML from
  # scratch, where no strict JSON schema applies.
  objective:
    escalate_immediately: true
    validators:
      required:
        - curie_anchoring
        - source_ref
      optional: []
      fail_action: regenerate

  # explanation: prose explanation block; source grounding + content-
  # type discriminator drive the gate. Similarity is advisory because
  # explanations are often paraphrased away from a single chunk.
  explanation:
    validators:
      required:
        - source_ref
        - content_type
        - manifest_completeness   # W3 §3.3 (non-blocking day-1; warning in workflows.yaml)
      optional:
        - similarity
      fail_action: regenerate

  # activity: hands-on practice block. Objective ref + source ref
  # required; accessibility (alt-text, contrast) is advisory until the
  # accessibility gate ships.
  activity:
    validators:
      required:
        - objective_ref
        - source_ref
        - manifest_completeness   # W3 §3.3 (non-blocking day-1; warning in workflows.yaml)
      optional:
        - accessibility
      fail_action: regenerate

  # callout: short note/warning/info block. Source grounding only —
  # callouts have no intrinsic Bloom level or objective ref.
  callout:
    validators:
      required:
        - source_ref
        - manifest_completeness   # W3 §3.3 (non-blocking day-1; warning in workflows.yaml)
      optional: []
      fail_action: regenerate

  # self_check_question: formative-assessment question; objective ref
  # + answerability required. Bloom classifier disagreement is
  # advisory because self-check Bloom is rarely structurally pinned.
  self_check_question:
    validators:
      required:
        - objective_ref
        - answerability
        - manifest_completeness   # W3 §3.3 (non-blocking day-1; warning in workflows.yaml)
      optional:
        - bloom_classifier_disagreement
      fail_action: escalate

  # reflection_prompt: open-ended journal prompt. Objective ref drives
  # the audit trail; reflection prompts are intentionally
  # non-grounded.
  reflection_prompt:
    validators:
      required:
        - objective_ref
        - manifest_completeness   # W3 §3.3 (non-blocking day-1; warning in workflows.yaml)
      optional: []
      fail_action: regenerate

  # discussion_prompt: peer-discussion prompt. Same shape as
  # reflection_prompt — objective-ref-anchored.
  discussion_prompt:
    validators:
      required:
        - objective_ref
        - manifest_completeness   # W3 §3.3 (non-blocking day-1; warning in workflows.yaml)
      optional: []
      fail_action: regenerate

  # chrome: page-level template chrome (header / footer / nav). No
  # pedagogical validators apply; the empty required list keeps the
  # dispatcher's filter inert for chrome blocks.
  chrome:
    validators:
      required: []
      optional: []
      fail_action: regenerate

  # recap: end-of-week summary. Source grounding required so the recap
  # is auditable back to the week's chunks.
  recap:
    validators:
      required:
        - source_ref
      optional: []
      fail_action: regenerate
