name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Advisory while the 1.7k-finding lint debt is paid down incrementally
      # (mass auto-fix rejected as release-adjacent risk). The job verdict is
      # the TEST step; lint findings stay visible in the log without masking
      # real test failures behind style debt.
      - name: Lint (advisory)
        continue-on-error: true
        run: ruff check lib/ MCP/ cli/ Trainforge/ LibV2/tools/ Courseforge/scripts/

      - name: Test
        run: pytest --cov --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema pytest

      - name: Run integrity checks
        run: python ci/integrity_check.py --verbose

      # The integrity run above already ENFORCES the course-slug guard
      # (registered as check_course_slug_leak). This step exercises the
      # guard's own unit tests, which live under ci/tests/ (outside the
      # pytest.ini testpaths the main `test` job scans).
      - name: Test course-slug guard
        run: python -m pytest ci/tests -q

  # The GUI suite (~494 tests under gui/tests/) imports FastAPI's TestClient.
  # The default `test` job installs only `.[dev]` (no fastapi), so those tests
  # silently skip/collect-error there. This job installs the `gui` extra so the
  # suite actually runs in CI. CPU-light: no pipeline run, no model download.
  gui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,dev]"

      - name: Test GUI suite
        run: python -m pytest gui/tests/ -q
