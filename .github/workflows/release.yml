name: Release

# Tagged-release pipeline. Fires on a semver tag push (``v*``, e.g. ``v0.3.0``)
# matching the scheme in VERSIONING.md. It gates the release on the test suite
# (core + GUI extras), validates the deployable Docker image builds, then cuts
# a GitHub release with auto-generated notes.
#
# NO registry push. No registry secrets exist in this repo, so the image is
# built and discarded (validation only). To publish the image on release:
# add a docker/login-action step (GHCR via GITHUB_TOKEN + `packages: write`,
# or Docker Hub via repo secrets), then flip the build job's `push: true` and
# tag the image with `${{ github.ref_name }}`. See docker.yml for the same
# note on the CI build job.
#
# Action versioning: this repo pins actions by major-version tag
# (actions/checkout@v4, docker/build-push-action@v6, codecov-action@v4), not by
# commit SHA. This workflow follows that convention.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required for creating the GitHub release

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (core + gui extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,dev]"

      - name: Run test suite
        run: python -m pytest -q

      - name: Run integrity checks
        run: python ci/integrity_check.py --verbose

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build GUI image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gui
          push: false
          tags: ed4all-gui:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: [test, docker]
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
