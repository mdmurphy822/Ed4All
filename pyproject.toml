[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ed4all"
version = "0.4.0"
description = "Unified orchestration for accessible educational content"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
keywords = ["education", "accessibility", "wcag", "imscc", "lms"]

dependencies = [
    "beautifulsoup4>=4.12.0,<5.0.0",
    "lxml>=4.9.0,<6.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "click>=8.0.0,<9.0.0",
    "rich>=13.0.0,<14.0.0",
    "jsonschema>=4.17.0,<5.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "rdflib>=7.0.0,<8.0.0",
    "pyld>=2.0.0,<4.0.0",
    "pyshacl>=0.25.0,<1.0.0",
    # httpx is a RUNTIME dependency of the turnkey local-provider lattice
    # (Trainforge/generators/providers/_openai_compatible_client.py + _local_provider +
    # _together_provider) and the local-openai embedding provider
    # (lib/embedding/providers.py). No base dependency pulls it in, so
    # without this explicit pin a bare install collected 33 import errors on
    # CI and could not run local authoring at all — hence the base pin below.
    "httpx>=0.27,<1.0",
]
# Note: the canonical chunker lives at ``Trainforge/chunker/`` (post-
# Phase-8 re-merge). It used to be a sibling workspace package
# (``ed4all-chunker @ file:./ed4all-chunker``), declared as a PEP 508
# direct-reference dependency. The re-merge removes the workspace-
# member machinery; no separate install step is needed. See
# ``plans/post-phase8-review-2026-05.md`` for the rationale.

[project.optional-dependencies]
# PDF processing lives in the ``[semantik]`` extra (the license-clean
# conversion cascade). The anthropic SDK is an opt-in, lazily-imported
# dependency of the api-mode LLM path (default posture is local/Together
# providers — see docs/LICENSING.md), declared in ``[anthropic]`` below for
# callers that explicitly want the cloud arm.
anthropic = [
    "anthropic>=0.18.0,<1.0.0",
]
server = [
    "mcp>=1.0.0,<2.0.0",
]
dev = [
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<6.0.0",
    # starlette's TestClient (newer starlette resolved on clean CI installs)
    # requires the httpx2 package explicitly; local venvs carry it
    # transitively, so without this pin the gui-tests CI job fails at
    # collection ("requires the httpx2 package to be installed").
    "httpx2",
    # pytest-asyncio is a test-only dependency. No default-install import
    # path imports pytest_asyncio (verified by grep); async tests are
    # driven purely by @pytest.mark.asyncio + pytest.ini::asyncio_mode =
    # auto, which only matter when running the test suite. Keeping it in
    # [dev] (the extra CI installs) avoids forcing a test plugin onto a
    # bare ``pip install -e .`` runtime install. Pairs with
    # pytest.ini::asyncio_mode = auto.
    "pytest-asyncio>=0.21.0,<1.0.0",
    "black>=23.0.0,<25.0.0",
    "ruff>=0.1.0,<1.0.0",
    "pyld>=2.0.0,<4.0.0",
    "pyshacl>=0.25.0,<1.0.0",
]
# Trainforge adapter fitting uses Transformers, TRL, PEFT, and bitsandbytes.
# Keep these large accelerator dependencies out of the default install so
# non-training commands remain lightweight.
#
# The supported band provides Nemotron remote-code loading, TRL's
# completion-only loss, current PEFT trainer argument names, and compatible
# 4-bit NF4 quantization. Keep these versions synchronized with the qualified
# training environment and validate the small-model regression fit before a
# larger training run.
training = [
    "torch>=2.1.0",
    "transformers>=4.57,<5",
    "trl>=0.25,<0.27",
    "peft>=0.17,<1.0",
    "accelerate>=1.0.0,<2.0.0",
    "bitsandbytes>=0.48,<1.0",
    "datasets>=2.18.0",
    "safetensors>=0.4.0",
    # Optional generic-benchmark sanity floor via the EleutherAI
    # lm-evaluation-harness. Wired through
    # ``Trainforge/eval/lm_eval_wrapper.py``; gated at runtime by
    # ``LM_EVAL_ENABLED=true`` because the multi-task sweep is intentionally
    # opt-in. The wrapper handles missing-package gracefully, so
    # this pin is only required when LM_EVAL_ENABLED is set.
    "lm-eval>=0.4.0,<1.0.0",
]
# Phase 4 Subtask 7: optional embedding deps for the statistical-tier
# validators in `lib/embedding/`. Kept out of the default install so
# CPU-only dev boxes don't pull in torch + transformers wheels just to
# run the orchestrator. Validators degrade to warning-severity
# `EMBEDDING_DEPS_MISSING` GateIssues when the extras are absent (per
# `lib/embedding/sentence_embedder.py::try_load_embedder`); strict-mode
# opt-in via `TRAINFORGE_REQUIRE_EMBEDDINGS=true` flips to critical.
embedding = [
    "sentence-transformers>=2.5.0,<4.0.0",
    "numpy>=1.24.0",
    "transformers>=4.49,<4.50",
    "torch>=2.0.0",
    # WS1.1 imports sklearn.cluster.AgglomerativeClustering directly for
    # TARGET-K Ward TO clustering (lib/objectives/objective_dedup.py). It
    # already arrives transitively via sentence-transformers; declared here
    # honestly because we now depend on it as a first-class import.
    "scikit-learn>=1.3,<2.0",
    # WorkedExampleMathValidator (lib/validators/worked_example_math.py) imports
    # sympy directly to symbolically re-check worked-example derivations (the
    # math-correctness control the number-blind NLI + numeric-literal-grounding
    # gates cannot provide). sympy already arrives transitively via torch, but
    # is declared here honestly because we now depend on it as a first-class
    # import. The validator graceful-degrades to a single warning-severity
    # SYMPY_MISSING GateIssue (passed=True) when it is absent — so it stays out
    # of the DEFAULT install (mirroring the EMBEDDING_DEPS_MISSING convention).
    "sympy>=1.9",
]
# Control-plane GUI (opt-in). FastAPI + uvicorn serve the vanilla-JS SPA and
# the /api + /ws routers. Kept out of the default install so the MCP server
# (which imports gui.shared_state / gui.settings_store with NO web deps) and
# CPU-only dev boxes don't pull web-server wheels. ``ed4all gui`` needs this.
gui = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0,<2.0",
]
# ``[full]`` is the "everything CPU-light" install: the MCP server, the
# dev/test toolchain, and the control-plane GUI. It does NOT include the
# heavy ML extras ``[training]`` (QLoRA: torch + transformers + trl + peft +
# bitsandbytes, 5+GB of CUDA wheels), ``[embedding]`` (sentence-transformers +
# torch for the statistical-tier validators), or ``[semantik]`` (the PDF→HTML
# conversion cascade — playwright + llama-cpp + ML stack, installed
# out-of-band; see its block below). Those stay opt-in so a default
# ``[full]`` install on a CPU-only box doesn't pull multi-GB GPU wheels.
# Install them explicitly when you need them:
#   pip install -e '.[full,embedding]'   # + retrieval / statistical validators
#   pip install -e '.[full,training]'    # + SLM fine-tuning (GPU)
#   pip install -e '.[full,anthropic]'   # + api-mode cloud LLM arm
full = ["ed4all[server,dev,gui]"]
# SemantiK in-process conversion cascade (the license-clean PDF→HTML pipeline).
# These are the deps MISSING from a venv that already carries the heavy ML
# stack (torch>=2.2, transformers>=4.45, peft>=0.10, scikit-learn, scipy,
# bitsandbytes, beautifulsoup4, lxml, pyyaml, pillow, requests, datasets —
# all satisfied via [training]/[embedding] or the base install, so
# they are NOT re-pinned here to avoid a resolver conflict). Install with
# ``pip install -e '.[semantik]'`` into a venv that already has the ML
# stack. Two deps are HANDLED OUT-OF-BAND (not listed here):
#   1. llama-cpp-python — needs a CUDA *source* build, NOT the CPU wheel:
#        CMAKE_ARGS="-DGGML_CUDA=on" \
#          pip install --no-binary llama-cpp-python llama-cpp-python
#      (Stage-6 specialists can alternatively use the NVIDIA endpoint via
#      SEMANTIK_SPECIALIST_PROVIDER=nvidia, so local llama is optional for
#      structure-only conversion — see SemantiK/CLAUDE.md.)
#   2. playwright's browser binary — after ``pip install``, run
#        ``playwright install chromium``
#      to fetch the headless Chromium used by the axe-core a11y audit.
semantik = [
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "pikepdf>=9.0",
    "pytesseract>=0.3.10",
    "axe-playwright-python>=0.1.7",
    "playwright>=1.40",
    "lingua-language-detector>=2.0",
    "einops>=0.8",
    "timm>=1.0",
    "num2words>=0.5",
]
# Eval-calibration cross-check (opt-in, OFFLINE ONLY). RAGAS is used ONCE,
# offline, to validate our citation-precision/recall denominator math against
# the field's ContextPrecision convention (eval-expansion plan §A, item E6) —
# it is NOT a runtime dependency and is NEVER imported in the eval run loop or
# any gate (our harness owns the metrics; the local-judge stays on our own
# loopback seat). MUST install into a THROWAWAY VENV, never the shared
# site-packages: every ragas release requires the langchain-0.3 line while
# this box's resident stack needs langchain-core >=1.4 — measured
# incompatible both directions (2026-07-19 fetch window). Recipe:
#   python3 -m venv /tmp/ragas-cal && /tmp/ragas-cal/bin/pip install \
#     'ragas==0.2.10' && <run the denominator cross-check> && rm -rf /tmp/ragas-cal
# Exact pin so the calibration basis is reproducible; bump deliberately,
# never via a resolver float. Apache-2.0.
eval-calibration = [
    "ragas==0.2.10",
]

[project.scripts]
ed4all = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*", "MCP*", "cli*", "gui*"]

[tool.coverage.run]
source = ["lib", "MCP", "cli", "gui"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.ruff]
cache-dir = "runtime/cache/ruff"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C90", "UP"]
ignore = ["UP006", "UP035", "UP045", "E501", "E741", "E402", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
