# Ed4All deployable stack — `docker compose up` serves Studio on :8077.
#
# Two services: the GUI (FastAPI control plane) and Ollama (local LLM + the
# grounded-answer backend). They MUST share a loopback view of each other
# because lib/retrieval/answer_backend.py refuses any non-loopback answer-
# provider base_url by design (Phase IA: no cloud answer path, ever).
#
# NETWORK SHAPE (pod-style shared namespace): the gui service joins the ollama
# service's network namespace (`network_mode: "service:ollama"`), so the GUI
# reaches Ollama at http://localhost:11434 — a genuine loopback address from
# the GUI process's perspective. The answer-path loopback policy holds with
# zero weakening, and Studio's :8077 is published as a normal bridged port on
# the namespace-owning service.
#
# Do NOT replace this with `network_mode: host`. On Docker Desktop
# (Windows/WSL2, macOS) host networking places containers in the Desktop VM's
# namespace, which has no ingress path from the host, so Studio would be
# reachable nowhere user-visible. The shared-netns sidecar keeps the loopback
# hop AND normal published-port ingress on every platform.
#
# Note: published ports live on the `ollama` service because it owns the
# shared namespace — Docker requires port mappings on the namespace owner.

services:
  gui:
    build:
      context: .
      dockerfile: Dockerfile.gui
    image: ed4all-gui:latest
    # Join the ollama service's network namespace (see header). localhost is
    # shared between the two containers; nothing else changes.
    network_mode: "service:ollama"
    environment:
      # Redundant with the image ENV, but explicit here so an operator editing
      # compose sees the data root + serve mode without reading the Dockerfile.
      ED4ALL_HOME: /data
      ED4ALL_GUI_MODE: studio
      # If you switch ED4ALL_GUI_MODE to `full` to reach the operator surface
      # remotely, set a shared-secret operator token (required before any
      # non-loopback operator deploy). Studio mode mounts no operator surface,
      # so the token is unused here. See docs/operations/docker.md.
      # ED4ALL_GUI_TOKEN: "change-me-to-a-long-random-secret"
      HF_HOME: /data/hf-cache
      # Answer + embedding backends point at the loopback Ollama service.
      ED4ALL_ANSWER_PROVIDER: local
      # 7B Q4 (~4.7GB) fits common 8GB consumer GPUs fully resident — and is
      # tolerable on CPU-only boxes. The code-registry default (qwen2.5:14b)
      # needs ~10GB and splits CPU/GPU on 8GB cards; opt up by editing this
      # line and pulling the model into the sidecar.
      ED4ALL_ANSWER_MODEL: qwen2.5:7b-instruct-q4_K_M
      ED4ALL_EMBEDDING_PROVIDER: st
      # REQUIRED for this image. ED4ALL_EMBEDDING_DEVICE defaults to `cuda` in
      # code (index builds, query encoding, and the validator-tier embedder)
      # and there is NO automatic CUDA->CPU fallback — auto-detection is
      # silent degradation, which this project forbids. This image ships
      # `[gui,server,embedding]` on CPU torch, so it must SELECT cpu or the
      # first index build / semantic query raises EmbeddingBackendUnavailable.
      # CPU is a fully-supported explicit selection, not a degraded mode.
      # See docs/operations/docker.md "Required: pin the embedding device to CPU".
      ED4ALL_EMBEDDING_DEVICE: cpu
      # Claim-attribution citation prune+add at answer-composition time. The
      # code default is `shadow` (compute + capture, mutate nothing); this
      # deployment wants it LIVE — drop model-cited citations that back no
      # answer sentence, and credit an uncited high-support passage the model
      # under-cited — so the learner's source list reflects the measured
      # support story. Never changes an answer verdict; always keeps >= 1
      # citation. Knob: ED4ALL_ANSWER_PRUNE_MIN_OVERLAP (default 0.25).
      ED4ALL_ANSWER_CITATION_PRUNE: "on"
      # Prune support threshold — a stricter, higher-precision keep bar than the
      # code default (0.25), from the precision-floored calibration rule. The
      # code default is unchanged; this is a per-deployment choice.
      ED4ALL_ANSWER_PRUNE_MIN_OVERLAP: "0.444444"
      # NLI-based citation ADD arm — entailment-driven, because the older
      # shingle-overlap ADD arm cannot work on paraphrased answers (they never
      # quote the source). Code default is `off`: the ~750 MB NLI model must not
      # load on the default answer path. This deployment runs `shadow` — compute
      # would-adds + emit the capture and eval diagnostics, MUTATE NOTHING — so
      # counts accumulate where the NLI model is already resident
      # (with_groundedness on). Flip to `on` only once the shadow counts
      # validate the composite criterion (ent>=0.70 AND token-coverage>=0.80 AND
      # every claim numeric present AND anchor resolves AND <=2 adds). Never
      # changes an answer verdict.
      ED4ALL_ANSWER_NLI_ADD: "shadow"
      # Serving window. The 4096 default evicts trailing retrieved passages on
      # an 8-passage prompt, so multi-part questions lose their later-ranked
      # support before the model ever sees it. 8192 holds a full 8-passage
      # prompt and MUST match the sidecar's OLLAMA_CONTEXT_LENGTH below. 7B q4 +
      # 8k KV cache still fits an 8GB GPU fully resident.
      ED4ALL_ANSWER_NUM_CTX: "8192"
      # Answer-path candidate filter. A build that emits per-CO assessments
      # harvests QTI assessment_item chunks into the chunkset; their text lives
      # in QTI XML, not in any archived HTML page, so they can never pass the
      # citation anchor gate and a model citation of one withholds the whole
      # answer. Exclude them from the candidate pool (over-fetch keeps top-k
      # full). Code default: unset (no filtering).
      ED4ALL_ANSWER_EXCLUDE_CHUNK_TYPES: "assessment_item"
      # Anchor containment floor for the answer-path citation gate. Lowered from
      # the 0.85 code default to admit genuine instructional chunks whose
      # containment lands just under it; the next failure band sits far below
      # (<=0.70), so 0.80 adds no fabrication risk.
      ED4ALL_ANSWER_ANCHOR_CONTAINMENT: "0.80"
    volumes:
      # Mutable runtime/state/training/upload data lives on a named volume mounted at
      # /data (= ED4ALL_HOME). The repo's CODE is NOT bind-mounted — the image
      # already contains it; mounting the repo over /app would shadow it.
      - ed4all-data:/data
      # The course library is the repo checkout's LibV2 — one shared store
      # for host runs and the containerized Studio. Read-write so pipeline
      # runs launched from the container archive into the same place the
      # host (and any non-Docker tooling) sees.
      - ./LibV2:/data/libv2
    restart: unless-stopped
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8077/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  ollama:
    image: ollama/ollama:latest
    environment:
      # Serve an 8k context window — pairs with the gui service's
      # ED4ALL_ANSWER_NUM_CTX above (see that comment for why 4096 is not
      # enough for multi-part grounded answers).
      OLLAMA_CONTEXT_LENGTH: "8192"
    # Owns the network namespace the gui service joins; port mappings for the
    # whole pod therefore live here.
    ports:
      # Studio (served by the gui process inside the shared namespace).
      - "8077:8077"
      # Ollama's API is intentionally NOT published — only the GUI needs it,
      # over the in-namespace loopback. Pull models with:
      #   docker compose exec ollama ollama pull <model>
    volumes:
      # Persist pulled models so a restart doesn't re-download multi-GB weights.
      - ollama-models:/root/.ollama
    restart: unless-stopped
    # ---- GPU profile (optional) -------------------------------------------
    # CPU-only by default. To run Ollama on an NVIDIA GPU, install the NVIDIA
    # Container Toolkit on the host and uncomment the block below, then
    # `docker compose up`. CPU inference works without it (slower).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ed4all-data:
  ollama-models:
