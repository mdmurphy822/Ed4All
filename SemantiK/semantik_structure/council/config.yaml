# Council per-BERT hyperparameters and base-encoder choice.
#
# Locked decisions (per Plans/01_implementation_plan.md DP-0.1):
#   - Council base encoder:  DeBERTa-v3-base   (~184M params, MIT license,
#                                                disentangled attention).
#   - Cross-encoder + theta: DeBERTa-v3-small  (~44M params).
#
# Fallback if DeBERTa's 512-token limit bites pair inputs:
#   ModernBERT-base (~150M params, 8K context, MIT). Pick before Phase 2
#   starts; locks LoRA target-module names.
#
# This file is read by future phases; Phase 0 lands the schema only. The
# `confidence_threshold_tau` value is the council's per-head ship gate
# from architecture.md §6 — top-1 confidence below tau routes to the soft
# reranker for second-look.

version: council-config-1.0

base_encoder:
  # Phase 2 (Goal A) chose ModernBERT-base as the working backbone:
  # transformers 5.5 cannot decode DeBERTa-v3-base's spm.model file
  # without tiktoken-incompatible artifacts. ModernBERT is the explicit
  # DP-0.1 fallback ("ModernBERT-base is the fallback if DeBERTa's
  # native 512 token limit bites... — both can be padded or chunked
  # rather than swapping bases"). 8K context is a strict win for the
  # Phase 4 cross-BERT reranker. Adapter target-module names changed
  # accordingly.
  family: modernbert
  variant: base
  hf_name: answerdotai/ModernBERT-base
  revision: main
  hidden_size: 768
  max_position_embeddings: 8192
  dtype: bf16

cross_encoder:
  family: deberta-v3
  variant: small
  hf_name: microsoft/deberta-v3-small
  revision: main
  hidden_size: 384
  max_position_embeddings: 512
  dtype: bf16

confidence_threshold_tau: 0.70   # architecture.md §6: top-1 < tau -> soft rerank

# Per-BERT hyperparameter slots. Phase 0 ships empty maps; each rollout
# phase fills its own block.
berts:
  math_detector:    {}
  span:             {}
  order:            {}
  role:             {}
  math_class:       {}
  table_class:      {}
  semantic:         {}
