# Council model choices and per-specialist hyperparameters for the live
# compatibility cascade. ModernBERT-base provides the council's shared 8K
# backbone; DeBERTa-v3-small provides the cross-encoder and theta backbone.
# The `confidence_threshold_tau` value is the council's per-head ship gate
# from architecture.md §6 — top-1 confidence below tau routes to the soft
# reranker for second-look.

version: council-config-1.0

base_encoder:
  # The 8K context supports long council inputs and fixes the LoRA target
  # module shape expected by the stored specialist adapters.
  family: modernbert
  variant: base
  hf_name: answerdotai/ModernBERT-base
  revision: main
  hidden_size: 768
  max_position_embeddings: 8192
  dtype: bf16

cross_encoder:
  family: deberta-v3
  variant: small
  hf_name: microsoft/deberta-v3-small
  revision: main
  hidden_size: 384
  max_position_embeddings: 512
  dtype: bf16

confidence_threshold_tau: 0.70   # architecture.md §6: top-1 < tau -> soft rerank

# Per-specialist hyperparameter slots consumed by council configuration.
berts:
  math_detector:    {}
  span:             {}
  order:            {}
  role:             {}
  math_class:       {}
  table_class:      {}
  semantic:         {}
