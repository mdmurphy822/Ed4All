[project]
name = "semantic"
version = "0.0.1"
description = "SemantiK structure-understanding model — Tesseract OCR output to WCAG-compliant HTML."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    # PDF handling — commercial-safe stack. No PyMuPDF (AGPL-3), no Poppler (GPL-2).
    "pypdfium2>=4.30",      # Apache-2 / BSD-3 — primary text + rendering
    "pdfplumber>=0.11",     # MIT — table detection + char layout
    "pikepdf>=9.0",         # MPL-2.0 — metadata, encryption, widgets
    "pytesseract>=0.3.10",  # Apache-2 — OCR fallback
    "playwright>=1.40",
    "requests>=2.31",
    "datasets>=2.18",
    "axe-playwright-python>=0.1.7",
    "pyyaml>=6.0",
    "pillow>=10.0",         # figure_captioner.py loads images via PIL.Image
]

[project.optional-dependencies]
# `runtime` is the self-sufficient inference lane: everything the runtime
# cascade lazily imports (council/base.py, theta/semantic_preservation.py,
# qwen_specialists/runtime.py, figure_captioner.py). `train` adds the
# fine-tuning-only deps on top via the self-referencing `semantic[runtime]`.
runtime = [
    # In-process Qwen GGUF inference for the Stage-6 council runtime
    # (semantik_structure/qwen_specialists/runtime.py: LlamaCppRuntime).
    # MUST be built from source against the system CUDA toolkit — the
    # PyPI wheels are CPU-only, and on CPU per-region MathML generation
    # is unusably slow. Install with:
    #   CUDA_HOME=/usr/local/cuda-12.4 PATH=$CUDA_HOME/bin:$PATH \
    #   CMAKE_ARGS="-DGGML_CUDA=on -DCMAKE_CUDA_ARCHITECTURES=86" \
    #   uv pip install --no-binary llama-cpp-python llama-cpp-python
    # (CMAKE_CUDA_ARCHITECTURES=86 targets the RTX 3070 / Ampere.)
    "llama-cpp-python>=0.3",
    "torch>=2.2",
    "transformers>=4.45",
    "peft>=0.10",
    "einops>=0.8.2",        # required by transformers models (no first-party import)
    "timm>=1.0.27",         # required by transformers vision models
    "num2words>=0.5.14",    # required by transformers models
    # Direct first-party runtime imports that were previously satisfied only by
    # manual `uv pip install` drift (absent from the lock → a clean `uv sync`
    # produced a broken runtime). See enrich.py / assembler/shell.py (lingua)
    # and theta/semantic_preservation.py IsotonicRegression calibration (sklearn).
    "lingua-language-detector>=2.0",  # enrich.py:77, assembler/shell.py:94 language gate
    "scikit-learn>=1.4",    # theta calibration (IsotonicRegression) + all trainers' metrics
    "scipy>=1.11",          # spearmanr in eval scripts; also backs scikit-learn
]
train = [
    "semantic[runtime]",
    "bitsandbytes>=0.43",
    "accelerate>=0.30",
    "trl>=0.9",
]
dev = [
    "ruff>=0.4",
]

[tool.uv]
# llama-cpp-python publishes CPU-only wheels; force a source build so the
# CUDA flags passed via CMAKE_ARGS (see the `runtime` extra above) take
# effect. Without this a plain `uv sync` silently installs the CPU wheel
# and GGUF inference runs on CPU instead of the GPU.
no-binary-package = ["llama-cpp-python"]

[tool.setuptools]
packages = ["semantik_structure"]

[tool.ruff]
line-length = 100
target-version = "py312"
