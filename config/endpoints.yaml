# Unified LLM/API endpoint registry — single source of truth.
#
# Every LLM/API endpoint the codebase attaches to is one named row below.
# Code attaches to endpoints BY NAME (e.g. "nvidia", "local") and the
# transport + identity (base_url, model, api_key env, provenance value)
# flow from the row — NOT from per-vendor provider modules or per-tier
# YAML base_urls. Adding a new endpoint (a future DGX Spark, a vLLM box,
# Together, ...) is a ONE-ROW change here plus running the provenance
# codegen — zero new code, zero hand-edits to the three Touch.provider
# enum sites.
#
# Loader: lib/llm/endpoints.py. Schema: schemas/config/endpoints.schema.json.
# Path override: ED4ALL_ENDPOINTS_PATH (else ED4ALL_HOME, else this file).
#
# Field contract (see the schema for the authoritative shape):
#   kind                  openai_compatible | anthropic | claude_session
#   base_url              default endpoint URL (null for SDK / dispatcher kinds)
#   base_url_env          env var overriding base_url (null = fixed endpoint)
#   api_key_env           env var holding the bearer key
#   api_key_default       fallback key (only "local" uses "local")
#   api_key_required      fail-loud when key unset and no injected client
#   model_env             env var overriding default_model
#   default_model         per-endpoint model id
#   loopback_only         endpoint-level loopback policy flag (default false)
#   provenance_provider   the closed Touch.provider value this endpoint stamps
#   vision_capable        carried from the LLM/embedding precedent
#   vision_capable_env    env var overriding vision_capable
#   unverified            audit flag (illustrative cloud stub not yet exercised)
#
# Resolution precedence per field (frozen, applies everywhere):
#   explicit kwarg > endpoint's *_env var > registry default.
#
# Provenance: the closed Touch.provider set is DERIVED from the union of
# every row's provenance_provider + the sentinel "deterministic". Many
# endpoints can map to one provenance value (together-vision -> together).
# The union here MUST stay equal to the historical hand-maintained set
# {anthropic, claude_session, deterministic, local, nvidia, together} —
# the provenance set is FROZEN across this refactor.
#
# LICENSING-CORRECTNESS (W9.1): a CLOUD endpoint MUST NOT stamp the
# license-clean "local" provenance. "local" tells a licensing auditor the
# artifact came from an Apache-2.0 local OSS model (training-permitted,
# clean); recording a hosted-cloud seat as "local" is a licensing LIE.
# The hosted-OSS cloud seats (groq / fireworks / deepseek — Llama-3.3-70B
# and DeepSeek served over a remote API) therefore map their provenance
# onto the existing CLOUD "together" value ("hosted OSS teacher, ToS-gated,
# NOT clean-local"), never "local". Mapping onto an existing Touch value
# keeps the provenance set frozen (no codegen churn) while telling the
# truth about corpus origin. Regression net:
# Trainforge/tests/test_synthesis_provenance_stamp.py + the cross-registry
# drift guard tests/test_endpoint_registry_drift_guard.py.
version: 1
endpoints:
  anthropic:
    kind: anthropic                 # SDK transport, NOT openai-wire
    base_url: null
    base_url_env: null
    api_key_env: ANTHROPIC_API_KEY
    api_key_required: true
    model_env: ANTHROPIC_SYNTHESIS_MODEL
    default_model: claude-sonnet-4-6
    provenance_provider: anthropic

  local:
    kind: openai_compatible
    base_url: http://localhost:11434/v1
    base_url_env: LOCAL_SYNTHESIS_BASE_URL
    api_key_env: LOCAL_SYNTHESIS_API_KEY
    api_key_default: local
    api_key_required: false
    model_env: LOCAL_SYNTHESIS_MODEL
    # 7B that fits an 8GB GPU fully resident (portable standard Ollama
    # tag). The registry default; LOCAL_SYNTHESIS_MODEL overrides per-run.
    default_model: qwen2.5:7b-instruct-q4_K_M
    # The answer path imposes loopback as a CONSUMER overlay; the endpoint
    # itself is local-by-default but is NOT gated here.
    loopback_only: false
    provenance_provider: local
    vision_capable: false
    vision_capable_env: LOCAL_VISION_CAPABLE

  together:
    kind: openai_compatible
    base_url: https://api.together.xyz/v1
    base_url_env: null              # fixed cloud endpoint
    api_key_env: TOGETHER_API_KEY
    api_key_required: true
    model_env: TOGETHER_SYNTHESIS_MODEL
    default_model: meta-llama/Llama-3.3-70B-Instruct-Turbo
    provenance_provider: together
    vision_capable: false

  nvidia:
    kind: openai_compatible
    base_url: https://integrate.api.nvidia.com/v1
    base_url_env: NVIDIA_BASE_URL
    api_key_env: NVIDIA_API_KEY
    api_key_required: true
    model_env: NVIDIA_LARGE_MODEL
    default_model: nvidia/nemotron-3-nano-30b-a3b
    provenance_provider: nvidia

  nvidia-deepseek:
    kind: openai_compatible
    base_url: https://integrate.api.nvidia.com/v1
    base_url_env: NVIDIA_BASE_URL
    api_key_env: NVIDIA_API_KEY
    api_key_required: true
    # DEDICATED model env — must NOT reuse NVIDIA_LARGE_MODEL (that drives
    # the nemotron `nvidia` row above; reusing it would collide).
    model_env: NVIDIA_DEEPSEEK_MODEL
    default_model: deepseek-ai/deepseek-v4-pro
    vision_capable: false
    # Maps onto the EXISTING `nvidia` provenance value so the frozen
    # Touch.provider set does not grow (NVIDIA-hosted, same vendor identity).
    provenance_provider: nvidia
    # deepseek-v4-pro is a REASONING model — it needs
    # chat_template_kwargs:{thinking:false} in the request body to suppress
    # chain-of-thought. SemantiK injects this via its own endpoint runtime
    # (SEMANTIK_SPECIALIST_DISABLE_THINKING). The general Ed4All
    # OpenAI-compatible backend (MCP/orchestrator/llm_backend.py) does NOT
    # yet forward extra_body — see the FOLLOW-UP note in the schema doc for
    # `extra_body` and in the row above. Declared here so the intent is
    # captured on the registry row; the projection carries it through for a
    # consumer that opts in.
    extra_body:
      chat_template_kwargs:
        thinking: false

  # ---------------------------------------------------------------------
  # DGX Spark self-hosted seats. NVIDIA Nemotron 3 models served LOCALLY on
  # a DGX Spark via a local vLLM OpenAI-compatible server (default port
  # 8000). One server, two served-model-names — both rows share
  # SPARK_BASE_URL / SPARK_API_KEY and differ only in the served model name.
  # Provenance is GENUINELY "local" (self-hosted OSS weights on our own box,
  # NVIDIA Open Model License permits commercial use + training on outputs) —
  # NOT the cloud "nvidia" provenance (that is the hosted integrate.api
  # seat, and stamping it here would both lie about origin and mis-flag the
  # corpus as license-restricted). "local" is already a provenance value, so
  # NO provenance-enum codegen is needed.
  # ---------------------------------------------------------------------
  spark-super:
    kind: openai_compatible
    base_url: http://localhost:8000/v1
    base_url_env: SPARK_BASE_URL
    api_key_env: SPARK_API_KEY
    api_key_default: local
    api_key_required: false
    model_env: SPARK_SUPER_MODEL
    # NVIDIA Nemotron 3 Super 120B-A12B (12B active MoE, NVFP4/MTP), served
    # locally on DGX Spark via vLLM; NVIDIA Open Model License (commercial +
    # train-on-outputs OK).
    default_model: nemotron-3-super-120b-a12b
    loopback_only: false
    provenance_provider: local
    vision_capable: false

  spark-nano:
    kind: openai_compatible
    base_url: http://localhost:8000/v1
    base_url_env: SPARK_BASE_URL
    api_key_env: SPARK_API_KEY
    api_key_default: local
    api_key_required: false
    model_env: SPARK_NANO_MODEL
    # NVIDIA Nemotron 3 Nano 30B-A3B (3.2B active), served locally on DGX
    # Spark via vLLM; fast tier + interactive answer. NVIDIA Open Model
    # License (commercial + train-on-outputs OK).
    default_model: nemotron-3-nano-30b-a3b
    loopback_only: false
    provenance_provider: local
    vision_capable: false

  claude_session:
    kind: claude_session            # LocalDispatcher subagent — NOT an HTTP endpoint
    base_url: null
    base_url_env: null
    api_key_required: false
    default_model: claude-sonnet-4-6
    provenance_provider: claude_session

  # ---------------------------------------------------------------------
  # Migrated verbatim from MCP/orchestrator/llm_backend.py::
  # _OPENAI_COMPATIBLE_PROVIDERS (keeps together-vision + the illustrative
  # groq/fireworks/deepseek stubs). These map their provenance onto an
  # existing CLOUD Touch value ("together") so the closed provenance set
  # does NOT grow — and, per W9.1, so a hosted-cloud seat never falsely
  # stamps the license-clean "local" provenance (see the header note).
  # ---------------------------------------------------------------------
  together-vision:
    kind: openai_compatible
    base_url: https://api.together.xyz/v1
    base_url_env: null
    api_key_env: TOGETHER_API_KEY
    api_key_required: true
    model_env: TOGETHER_VISION_MODEL
    default_model: meta-llama/Llama-3.2-90B-Vision-Instruct-Turbo
    provenance_provider: together
    vision_capable: true

  groq:
    kind: openai_compatible
    base_url: https://api.groq.com/openai/v1
    base_url_env: null
    api_key_env: GROQ_API_KEY
    api_key_required: true
    model_env: GROQ_SYNTHESIS_MODEL
    default_model: llama-3.3-70b-versatile
    # W9.1: hosted-cloud Llama-3.3-70B seat — maps to the CLOUD "together"
    # provenance, NEVER the license-clean "local" (see header note).
    provenance_provider: together
    unverified: true

  fireworks:
    kind: openai_compatible
    base_url: https://api.fireworks.ai/inference/v1
    base_url_env: null
    api_key_env: FIREWORKS_API_KEY
    api_key_required: true
    model_env: FIREWORKS_SYNTHESIS_MODEL
    default_model: accounts/fireworks/models/llama-v3p3-70b-instruct
    # W9.1: hosted-cloud Llama-3.3-70B seat — maps to the CLOUD "together"
    # provenance, NEVER the license-clean "local" (see header note).
    provenance_provider: together
    unverified: true

  deepseek:
    kind: openai_compatible
    base_url: https://api.deepseek.com/v1
    base_url_env: null
    api_key_env: DEEPSEEK_API_KEY
    api_key_required: true
    model_env: DEEPSEEK_SYNTHESIS_MODEL
    default_model: deepseek-chat
    # W9.1: hosted-cloud DeepSeek seat — maps to the CLOUD "together"
    # provenance, NEVER the license-clean "local" (see header note).
    provenance_provider: together
    unverified: true
