          # FR-A11Y-03 — typed B12 callout / non-color-coding gate. Flags
          # CALLOUT_NO_KIND (untyped callout) / CALLOUT_COLOR_ONLY (color/border
          # without a visible label+icon, WCAG 1.4.1) / CALLOUT_BODY_OVERFLOW
          # (~200-char cognitive-load ceiling) / CALLOUT_MOTION (motion without a
          # reduced-motion guard). Consumes inputs['blocks']. Rides
