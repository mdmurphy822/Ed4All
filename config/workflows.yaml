# Ed4All Workflow Definitions
# Defines available workflow types and their execution phases
#
# Phase 0 Hardening: Added retry_policy, poison_pill, and validation_gates

workflows:
  # Course Generation: Create IMSCC from objectives
  course_generation:
    description: Generate IMSCC course package from exam objectives

    # Phase 0: Retry policy configuration
    retry_policy:
      max_retries: 3
      retry_delay_seconds: [5, 30, 120]  # Exponential backoff
      transient_error_classes:
        - timeout
        - rate_limit
        - connection_error
        - service_unavailable
      permanent_error_classes:
        - validation_error
        - missing_input
        - permission_denied
        - schema_error

    # Phase 0: Poison pill detection
    poison_pill:
      threshold: 3  # N same-pattern failures stops batch
      window_seconds: 300  # 5 minute window

    phases:
      - name: planning
        agents: [course-outliner, requirements-collector]
        parallel: false
        max_concurrent: 1
        depends_on: []
        timeout_minutes: 60

      - name: content_generation
        agents: [content-generator]
        parallel: true
        max_concurrent: 10
        batch_by: week
        depends_on: [planning]
        timeout_minutes: 120
        batch_timeout_minutes: 30  # Phase 0: Per-batch timeout
        # Phase 3 Subtask 4: legacy single-pass disables itself when
        # the new two-pass router is engaged. Default off so legacy
        # runs stay byte-stable.
        enabled_when_env: "COURSEFORGE_TWO_PASS!=true"

        # Phase 0: Validation gates
        validation_gates:
          - gate_id: content_structure
            validator: lib.validators.content.ContentStructureValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: block
              on_error: fail_closed

          # Anti-silent-template guard (see textbook_to_course for rationale):
          # blocks the deterministic generate_week template emitter from
          # passing as LLM-authored content when LLM authoring was intended.
          - gate_id: content_authorship
            validator: lib.validators.content_authorship.ContentAuthorshipValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: block
              on_error: fail_closed
            description: Block the deterministic template emitter from passing as LLM-authored content in a real run

          # W3 — per-block synthesis-manifest RESOLUTION gate (single-pass
          # mirror; see textbook_to_course for the full rationale). Day-1
          # SHADOW (warning) so a legacy single-pass run is never blocked
          # before the emission is proven on a live run.
          # TODO(integration): flip to critical after a live run confirms emission.
          - gate_id: manifest_completeness
            validator: lib.validators.manifest_completeness.ManifestCompletenessValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            config:
              require_concept_tags: false   # warning day-1; flip to critical after a shaded run (§3.4)
            description: >
              W3 — assert every synthesized block carries a complete, well-formed
              synthesis manifest. RESOLUTION only — NOT entailment. SHADOW/warning
              day-1 until a live run proves the emission.

      # Phase 3 Subtask 4: two-pass router phases mirrored from
      # textbook_to_course. Engaged when ``COURSEFORGE_TWO_PASS=true``.
      - name: content_generation_outline
        agents: [content-generator]
        # NOTE: parallel/batch_by intentionally disabled. The handler
        # ``MCP/tools/pipeline_tools.py::_run_content_generation_outline``
        # iterates ``for week_num in range(1, duration_weeks + 1)``
        # internally with no ``week_range`` slicing, so dispatching N
        # parallel tasks would emit N² LLM calls. Re-enable only after
        # the handler accepts a ``week_range`` kwarg.
        parallel: false
        max_concurrent: 1
        depends_on: [planning]
        timeout_minutes: 30
        batch_timeout_minutes: 10
        description: Phase 3 — outline-tier Block emit (terse provider, no HTML body)
        enabled_when_env: "COURSEFORGE_TWO_PASS=true"

      - name: inter_tier_validation
        agents: []
        parallel: false
        max_concurrent: 1
        depends_on: [content_generation_outline]
        timeout_minutes: 5
        description: Phase 3 — run structural validators on the outline tier
        enabled_when_env: "COURSEFORGE_TWO_PASS=true"

        validation_gates:
          - gate_id: outline_curie_anchoring
            validator: Courseforge.router.inter_tier_gates.BlockCurieAnchoringValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_error: warn

          - gate_id: outline_content_type
            validator: Courseforge.router.inter_tier_gates.BlockContentTypeValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_error: warn

          - gate_id: outline_page_objectives
            validator: Courseforge.router.inter_tier_gates.BlockPageObjectivesValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_error: warn

          # Worker W7: assessment_item payload-shape gate. Filters
          # blocks[] to block_type == "assessment_item" and asserts
          # distractors[] (>=2) + correct_answer_index (>=0, <
          # len(distractors)) + per-distractor text (non-empty) +
          # optional misconception_ref pattern match. Closes the W7
          # regression class (one-distractor assessment_item).
          - gate_id: outline_assessment_item_payload
            validator: lib.validators.assessment_item_payload.BlockAssessmentItemPayloadValidator
            severity: critical
            threshold:
              max_critical_issues: 0

          # IB3.4 — anchored-rubric presence on Evaluate/Create scored blocks.
          # Warning day-1; no-ops when ED4ALL_ALIGNMENT_VERB_TRIPLE is unset.
          # TODO(calibration) — IB3 FAST-FLIP: this is the framework keystone
          # (the single load-bearing validity rule). Flip
          # BLOCK_OBJECTIVE_VERB_TRIPLE_MISMATCH (+ this companion alignment
          # gate) to critical (severity: critical, on_fail: block) after ONE
          # >=2-corpus FP measurement clears (NOT the multi-wave deferral the
          # other gates take). A Create objective checked by a recall MCQ is a
          # malformed block, not a style choice — the cost of a false NEGATIVE
          # (shipping a mis-aligned block) exceeds the cost of a false positive
          # here, inverting the usual warning-first conservatism. Evidence
          # target: verb-triple mismatch-rate measured on >=2 corpora with
          # manual FP audit; the per-pair verb_triple_status on every alignment
          # entry makes the audit replayable.
          - gate_id: outline_anchored_rubric
            validator: lib.validators.alignment.anchored_rubric.AnchoredRubricValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: IB3.4 — Evaluate/Create scored blocks must ship an exemplar-anchored rubric published before the task. Warning day-1; no-ops when ED4ALL_ALIGNMENT_VERB_TRIPLE is unset.

          # IB3.5 — triangle completeness (every objective has >=1 activity +
          # >=1 band-aligned assessment). Warning day-1; no-ops when the flag
          # is unset. TODO(calibration) — IB3 FAST-FLIP: see the
          # outline_anchored_rubric marker above (the keystone verb-triple gate
          # flips critical after ONE >=2-corpus FP measurement, not the
          # multi-wave deferral).
          - gate_id: outline_triangle_completeness
            validator: lib.validators.alignment.triangle_completeness.TriangleCompletenessValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: IB3.5 — every objective has >=1 activity AND >=1 band-aligned assessment (the complete constructive-alignment triangle). Warning day-1; no-ops when ED4ALL_ALIGNMENT_VERB_TRIPLE is unset.

          # NOTE — render-dependent IB4.5 / IB6 gates (udl_coverage,
          # anatomy_slot_presence, interaction_feedback, block_quality_rubric,
          # qa_checklist) are INTENTIONALLY ABSENT from the outline-tier
          # inter_tier_validation phase. They measure fields that exist only
          # after the rewrite/render stage (UDL n_representations derives from
          # rendered HTML tags; the IB1 anatomy interaction/feedback/transition
          # slots, the (verb·level·knowledge-type) Bloom chip, and the rendered
          # interaction/feedback HTML are all rewrite-tier emit), so against
          # outline-tier dict blocks they blanket-fail every block as a false
          # positive (course-a-calib calibration run, 2026-06-24: udl_coverage
          # 50/50 UDL_SINGLE_REPRESENTATION, qa_checklist 50/50 QA3_NO_BLOOM_TAG,
          # block_quality_rubric 2664, interaction_feedback 2146,
          # anatomy_slot_presence 74). They remain wired at
          # post_rewrite_validation, where the rendered fields exist and the
          # signal is real.
          # IB6.4 cognitive-load: reads the BODY text (content), present at
          # outline tier → meaningful pre-render. No-op when the keystone flag
          # ED4ALL_BLOCK_QUALITY_RUBRIC is unset (byte-stable). Warning-day-1;
          # TODO(calibration) — the hard-gate critical flip is DEFERRED until
          # the anchored 0-3 scale is calibrated on >=2 corpora.
          - gate_id: block_cognitive_load
            validator: lib.validators.content.BlockCognitiveLoadValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: IB6.4 — per-block <=~200-char / <=4-idea-chunk body ceiling (D2). Warning day-1; TODO(calibration).

          # IB7.5b — spacing-aware retrieval-presence floor: every
          # content-bearing module must carry >=1 low-stakes retrieval block
          # (self_check_question / reflection_prompt) SPACED from (not the
          # first block on) the content page. Pure block-type / page-grouping,
          # NO embeddings. action=regenerate on miss.
          # TODO(calibration) — flip MODULE_NO_RETRIEVAL / RETRIEVAL_UNSPACED to
          # critical after a >=2-corpus FP measurement (WS3/W4 deferred-flip
          # pattern; IB3 is the single documented fastest-flip exception, this
          # is NOT IB3).
          - gate_id: retrieval_presence
            validator: lib.validators.retrieval_presence.RetrievalPresenceValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: IB7.5b — >=1 spaced low-stakes retrieval block per content-bearing module. Warning day-1; deferred critical-flip.

          # FR-COURSE-02 — pedagogical block-sequence-order floor. Flags
          # worked_example(B05)->guided-practice(B08) out of order, a check
          # (B07) massed against same-objective exposition, and a scenario
          # (B09) opening a TO module. Consumes inputs['blocks']; runs warning-
          # day-1 regardless of any flag (mirrors retrieval_presence).
          # TODO(calibration) — flip these three codes to critical after a
          # >=2-corpus FP measurement (WS3/W4 deferred-flip pattern; IB3 is the
          # single documented fastest-flip exception, this is NOT IB3).
          - gate_id: block_sequence_order
            validator: lib.validators.block_sequence_order.BlockSequenceOrderValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: FR-COURSE-02 — worked-example->guided fade gradient, check spacing, scenario-opens-TO. Warning day-1; deferred critical-flip.

          # IB7.6c — per-type Bloom-range ceiling enforcement (advisory->gate
          # promotion of block_catalog.yaml's bloom_ceiling). Flags a block
          # whose declared/observed target Bloom exceeds its type's stretch
          # ceiling. action=regenerate on miss.
          # TODO(calibration) — flip BLOCK_BLOOM_OVER_CEILING to critical after
          # a >=2-corpus FP measurement (WS3/W4 deferred-flip pattern; IB3 is
          # the single documented fastest-flip exception, this is NOT IB3).
          - gate_id: bloom_type_range
            validator: lib.validators.bloom_type_range.BloomTypeRangeValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: IB7.6c — per-type Bloom-range ceiling (block Bloom <= type bloom_ceiling). Warning day-1; deferred critical-flip.

      - name: content_generation_rewrite
        agents: [content-generator]
        # NOTE: parallel/batch_by intentionally disabled. The handler
        # ``MCP/tools/pipeline_tools.py::_run_content_generation_rewrite``
        # iterates ``for week_num in range(1, duration_weeks + 1)``
        # internally with no ``week_range`` slicing, so dispatching N
        # parallel tasks would emit N² LLM calls. Re-enable only after
        # the handler accepts a ``week_range`` kwarg.
        parallel: false
        max_concurrent: 1
        depends_on: [inter_tier_validation]
        # Local-7B authoring of a multi-block course rewrite tier (per-block
        # CURIE-preservation retries on a slow local model) needs a wide
        # ceiling; these are MAX caps (the phase finishes as soon as the
        # single rewrite task returns), so a long timeout never slows a fast
        # cloud run — it only stops the slow local path from being killed
        # mid-rewrite by the default 30-min batch cap.
        timeout_minutes: 240
        batch_timeout_minutes: 240
        description: Phase 3 — rewrite-tier HTML emit consuming validated Block outlines
        enabled_when_env: "COURSEFORGE_TWO_PASS=true"

      # Phase 3.5 Subtask 11: mirror of textbook_to_course's
      # post_rewrite_validation phase. Runs the same four
      # Block-input validators from inter_tier_validation against the
      # rewrite-tier blocks_final_path so a rewrite-tier HTML emit
      # that drops a CURIE / content_type / objective_ref / source_id
      # silently is caught before packaging consumes it.
      - name: post_rewrite_validation
        agents: []
        parallel: false
        max_concurrent: 1
        depends_on: [content_generation_rewrite]
        timeout_minutes: 5
        description: Phase 3.5 — re-run inter-tier validators on rewrite-tier blocks
        enabled_when_env: "COURSEFORGE_TWO_PASS=true"

        validation_gates:
          - gate_id: rewrite_curie_anchoring
            validator: Courseforge.router.inter_tier_gates.BlockCurieAnchoringValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_error: warn

          - gate_id: rewrite_content_type
            validator: Courseforge.router.inter_tier_gates.BlockContentTypeValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_error: warn

          - gate_id: rewrite_page_objectives
            validator: Courseforge.router.inter_tier_gates.BlockPageObjectivesValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_error: warn

          - gate_id: rewrite_source_refs
            validator: Courseforge.router.inter_tier_gates.BlockSourceRefValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_error: warn

          # Worker W7: rewrite-tier symmetric mirror of
          # outline_assessment_item_payload (inter_tier_validation).
          # Scrapes <li data-cf-distractor-index="N"> siblings out of
          # the rewrite-tier HTML and asserts >=2 entries with
          # contiguous 0-based indices.
          - gate_id: rewrite_assessment_item_payload
            validator: lib.validators.assessment_item_payload.BlockAssessmentItemPayloadValidator
            severity: critical
            threshold:
              max_critical_issues: 0

          # Followup §3.2: HTML-shape sentinel mirrored from
          # textbook_to_course::post_rewrite_validation. Closes the
          # JSON-wrapped-emit regression class.
          # IB5.7: this gate ALSO carries the per-block B04/B06 a11y-shape arms
          # (multimedia captions/AD/transcript/controls stack + diagram
          # long-desc/data-table), gated in-validator on new_block_types_enabled
          # (ED4ALL_NEW_BLOCK_TYPES) and emitted at WARNING severity
          # (REWRITE_IB5_A11Y_CONTRACT) so the existing critical parse-fail /
          # I6 behavior is untouched. TODO(calibration) — flip the IB5
          # multimedia/diagram contracts to critical after a >=2-corpus FP
          # measurement (see _check_ib5_a11y_shape in the validator).
          - gate_id: rewrite_html_shape
            validator: lib.validators.rewrite_html_shape.RewriteHtmlShapeValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_error: fail_closed
            description: Followup §3.2 — verify rewrite-tier emit is a bare HTML body fragment with required data-cf-* attributes per block_type.

          # Followup §3.3: sentence-level source-grounding sentinel
          # mirrored from textbook_to_course::post_rewrite_validation.
          - gate_id: rewrite_source_grounding
            validator: lib.validators.rewrite_source_grounding.RewriteSourceGroundingValidator
            severity: warning                  # W4: DEMOTED from critical — cosine is now a cheap pre-filter; NLI block_prose_entailment is the critical text-trace enforcer (after §4 calibration).
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn                    # W4: was on_fail: block (implicit) — now advisory
              on_error: warn                   # W4: was fail_closed — cosine degrade is non-fatal now
            config:
              thresholds:
                min_grounding_cosine: 0.45
                min_grounded_sentence_rate: 0.60
            description: "W4 — cosine paraphrase pre-filter (DEMOTED to warning). NLI block_prose_entailment is the critical text-trace enforcer."

          # W4 — full-prose NLI entailment, two-pass mirror of the
          # textbook_to_course::post_rewrite_validation gate. Day-1 SHADOW
          # (warning): computes + captures, does not gate.
          # TODO(calibration): promote to critical after
          # state/calibration/block_prose_entailment_calibration.json
          # decision:promote_critical — flip is severity: critical,
          # behavior.on_fail: block, config.shadow: false,
          # config.thresholds.min_block_entailment_rate: <CALIBRATED>. The
          # calibration run needs a live local-7B synthesis pass (DEFERRED).
          - gate_id: block_prose_entailment
            validator: lib.validators.block_prose_entailment.BlockProseEntailmentValidator
            severity: warning                  # SHADOW day-1 -> critical post-calibration (§4)
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn                    # SHADOW -> block post-calibration
              on_error: fail_closed
            config:
              shadow: true                     # forces emitted issues to warning-severity during calibration (§4.3)
              thresholds:
                min_block_entailment_rate: 0.60
                entailment_floor: 0.70
                contradiction_floor: 0.50
                max_contradicted_rate: 0.05
            description: "W4 — full-block-prose NLI entailment vs cited chunks (windowed scorer-v2). SHADOW until §4 calibration pins the floor, then critical."

          # Numeric-literal grounding — the fabrication control for NUMERIC /
          # math content that the number-blind NLI gate cannot provide.
          # Established this session (content-block-quality iters 5/5b):
          # DeBERTa-v3-mnli scores a fabricated worked-example input (-40/88,
          # present in ZERO real chunks) ABOVE every grounded math claim, and
          # groundedness._is_computational EXEMPTS such claims, so
          # block_prose_entailment gives no numeric fabrication protection.
          # This gate cross-checks each prose fraction's num/denom pair against
          # the cited source under OCR-tolerant containment. Day-1 SHADOW
          # (warning): measured clean separation on the real sample-course-a
          # corpus (grounded blocks 0% source-absent; fabrication blocks flag).
          # TODO(calibration): promote to critical (config.shadow: false,
          # severity: critical, behavior.on_fail: regenerate) after measuring
          # the false-positive rate on a ≥2-corpus run; if a corpus shows
          # legitimate computed-result false-positives, flip
          # config.thresholds.min_absent_fractions to a source_absent_ratio
          # floor (the ratio is surfaced on every decision event).
          - gate_id: numeric_literal_grounding
            validator: lib.validators.numeric_literal_grounding.NumericLiteralGroundingValidator
            severity: warning                  # SHADOW day-1 -> critical post-calibration
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn                    # SHADOW -> regenerate post-calibration
              on_error: warn
            config:
              shadow: true                     # forces emitted issues to warning-severity during calibration
              thresholds:
                min_absent_fractions: 1
            description: "Numeric-literal grounding — cross-check prose fractions vs cited source (OCR-tolerant). The fabrication control for math content the number-blind NLI gate cannot provide. SHADOW until ≥2-corpus calibration, then critical."

          # W3 — per-block synthesis-manifest RESOLUTION gate (two-pass mirror;
          # see textbook_to_course for the full rationale). Day-1 SHADOW
          # (warning) until a live run proves the rewrite-tier emission.
          # TODO(integration): flip to critical after a live run confirms emission.
          - gate_id: manifest_completeness
            validator: lib.validators.manifest_completeness.ManifestCompletenessValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            config:
              require_concept_tags: false   # warning day-1; flip to critical after a shaded run (§3.4)
            description: >
              W3 — assert every synthesized block carries a complete, well-formed
              synthesis manifest. RESOLUTION only — NOT entailment. SHADOW/warning
              day-1 until a live run proves the emission.

          # CB5a — stub-example safety-net gate. Catches an ``example``
          # block carrying only a problem statement with no worked
          # solution (length floor + solution-evidence heuristic). Pure
          # HTML/text — no embeddings.
          # TODO(calibration): SHADOW-landed warning. Flip to
          # severity: critical + behavior.on_fail: regenerate after
          # measuring the false-positive rate on a real local-7B run.
          - gate_id: example_completeness
            validator: lib.validators.example_completeness.ExampleCompletenessValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            config:
              thresholds:
                min_word_tokens: 40
            description: >
              CB5a — flag a stub ``example`` block (problem statement, no
              worked solution). SHADOW/warning day-1; flip to
              regenerate/critical after a real-run false-positive measure.

          # IB3.4 — anchored-rubric presence on Evaluate/Create scored blocks
          # (post-rewrite mirror). Warning day-1; no-ops when
          # ED4ALL_ALIGNMENT_VERB_TRIPLE is unset.
          # TODO(calibration) — IB3 FAST-FLIP: this is the framework keystone
          # (the single load-bearing validity rule). Flip
          # BLOCK_OBJECTIVE_VERB_TRIPLE_MISMATCH (+ this companion alignment
          # gate) to critical (severity: critical, on_fail: block) after ONE
          # >=2-corpus FP measurement clears (NOT the multi-wave deferral the
          # other gates take). A Create objective checked by a recall MCQ is a
          # malformed block, not a style choice — the false-negative cost
          # exceeds the false-positive cost, inverting the usual warning-first
          # conservatism. Evidence target: verb-triple mismatch-rate on >=2
          # corpora with manual FP audit; per-pair verb_triple_status makes the
          # audit replayable.
          - gate_id: rewrite_anchored_rubric
            validator: lib.validators.alignment.anchored_rubric.AnchoredRubricValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: IB3.4 — Evaluate/Create scored blocks must ship an exemplar-anchored rubric published before the task (post-rewrite). Warning day-1; no-ops when ED4ALL_ALIGNMENT_VERB_TRIPLE is unset.

          # IB3.5 — triangle completeness (post-rewrite mirror). Warning day-1;
          # no-ops when the flag is unset. TODO(calibration) — IB3 FAST-FLIP:
          # see the rewrite_anchored_rubric marker above (keystone verb-triple
          # gate flips critical after ONE >=2-corpus FP measurement).
          - gate_id: rewrite_triangle_completeness
            validator: lib.validators.alignment.triangle_completeness.TriangleCompletenessValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: IB3.5 — every objective has >=1 activity AND >=1 band-aligned assessment (post-rewrite). Warning day-1; no-ops when ED4ALL_ALIGNMENT_VERB_TRIPLE is unset.

          # IB4.5 — UDL multiple-means coverage (>=2 representations per
          # content-bearing block + a per-week engagement/autonomy floor;
          # QA-13 / D7) on the rewrite-tier Block batch. Deterministic (derives
          # on read); runs warning-day-1 regardless of ED4ALL_BLOCK_A11Y.
          # TODO(calibration) — flip UDL_SINGLE_REPRESENTATION to critical after
          # a >=2-corpus FP measurement (WS3/W4 deferred-flip pattern; IB3 is the
          # single documented fastest-flip exception, this is NOT IB3).
          - gate_id: udl_coverage
            validator: lib.validators.udl_coverage.UdlCoverageValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: IB4.5 — UDL >=2-representations + per-week autonomy floor (post-rewrite). Warning day-1; deferred critical-flip.

          # IB6 — eight-dimension block-quality rubric surface. All five gates
          # no-op (passed=True, info issue) when the IB6 keystone flag
          # ED4ALL_BLOCK_QUALITY_RUBRIC is unset, so default-off runs are
          # byte-stable. Warning-day-1; TODO(calibration) — the hard-gate
          # critical flip (mean>=2.0 floors + Accessibility=0 block-fail) is
          # DEFERRED until the anchored 0-3 scale is calibrated on >=2 corpora
          # (see plans/finegrain/ib6-*.md §4; the mean floors would block early
          # runs).
          - gate_id: block_cognitive_load
            validator: lib.validators.content.BlockCognitiveLoadValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: IB6.4 — per-block <=~200-char / <=4-idea-chunk body ceiling (D2). Warning day-1; TODO(calibration).
          - gate_id: anatomy_slot_presence
            validator: lib.validators.anatomy_slot_presence.AnatomySlotPresenceValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: IB6.2 — six-slot anatomy presence (interaction/feedback/transition). Warning day-1; TODO(calibration).
          - gate_id: interaction_feedback
            validator: lib.validators.interaction_feedback.InteractionFeedbackValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: IB6.3 — universal interaction-feedback presence + elaboration gate. Warning day-1; TODO(calibration).
          - gate_id: block_quality_rubric
            validator: lib.validators.block_quality_rubric.BlockQualityRubricValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: IB6.1 — per-block eight-dimension 0-3 rubric scoring (composes upstream signals). Warning day-1; TODO(calibration).
          - gate_id: qa_checklist
            validator: lib.validators.qa_checklist.QaChecklistValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: IB6.7 — 15-point per-block QA checklist (composes IB1-IB6.6 + QA-9/13/15 net-new). Warning day-1; TODO(calibration).

          # IB7.5b — spacing-aware retrieval-presence floor: every
          # content-bearing module must carry >=1 low-stakes retrieval block
          # (self_check_question / reflection_prompt) SPACED from (not the
          # first block on) the content page. Pure block-type / page-grouping,
          # NO embeddings. action=regenerate on miss.
          # TODO(calibration) — flip MODULE_NO_RETRIEVAL / RETRIEVAL_UNSPACED to
          # critical after a >=2-corpus FP measurement (WS3/W4 deferred-flip
          # pattern; IB3 is the single documented fastest-flip exception, this
          # is NOT IB3).
          - gate_id: retrieval_presence
            validator: lib.validators.retrieval_presence.RetrievalPresenceValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: IB7.5b — >=1 spaced low-stakes retrieval block per content-bearing module. Warning day-1; deferred critical-flip.

          # IB7.6c — per-type Bloom-range ceiling enforcement (advisory->gate
          # promotion of block_catalog.yaml's bloom_ceiling). Flags a block
          # whose declared/observed target Bloom exceeds its type's stretch
          # ceiling. action=regenerate on miss.
          # TODO(calibration) — flip BLOCK_BLOOM_OVER_CEILING to critical after
          # a >=2-corpus FP measurement (WS3/W4 deferred-flip pattern; IB3 is
          # the single documented fastest-flip exception, this is NOT IB3).
          - gate_id: bloom_type_range
            validator: lib.validators.bloom_type_range.BloomTypeRangeValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: IB7.6c — per-type Bloom-range ceiling (block Bloom <= type bloom_ceiling). Warning day-1; deferred critical-flip.

          # B15 — WCAG 2.4.4 Link Purpose gate for the new B15 ``resources``
          # block type. Flags any link whose text is non-descriptive (bare URL
          # / "click here" / "read more" / empty) as RESOURCE_LINK_PURPOSE_
          # UNCLEAR. No-op + byte-stable when ED4ALL_NEW_BLOCK_TYPES is unset
          # (the same flag that makes the B15 type selectable / renderable).
          # action=regenerate on miss.
          # TODO(calibration) — flip RESOURCE_LINK_PURPOSE_UNCLEAR to critical
          # after a >=2-corpus FP measurement (WS3/W4 deferred-flip pattern;
          # IB3 is the single documented fastest-flip exception, this is NOT IB3).
          - gate_id: resource_link_purpose
            validator: lib.validators.resource_link_purpose.ResourceLinkPurposeValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: B15 — WCAG 2.4.4 descriptive-link-text on resources blocks. Warning day-1; deferred critical-flip; no-op when ED4ALL_NEW_BLOCK_TYPES unset.

          # FR-INT-02 — B08 guided-practice sequence + fade-state gate for the
          # ``guided_practice`` block type. Flags B08_PRACTICE_NOT_AFTER_WORKED
          # (a guided_practice with no worked_example before it) +
          # B08_PRACTICE_NO_FADE_STATE (no worked/completion/independent stage).
          # No-op + byte-stable when ED4ALL_NEW_BLOCK_TYPES is unset (the same
          # flag the B08 first-class type rides). action=regenerate on miss.
          # TODO(calibration) — flip the B08 sequence codes to critical after a
          # >=2-corpus FP measurement (WS3/W4 deferred-flip pattern; IB3 is the
          # single documented fastest-flip exception, this is NOT IB3).
          - gate_id: b08_sequence
            validator: lib.validators.b08_sequence.B08SequenceValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: FR-INT-02 — B08 guided-practice follows a worked_example + carries a fade_state. Warning day-1; deferred critical-flip; no-op when ED4ALL_NEW_BLOCK_TYPES unset.

          # FR-INT-06 — B09 mandatory case/scenario debrief gate for the
          # ``scenario`` block type. Flags SCENARIO_DEBRIEF_MISSING when a B09
          # scenario carries no debrief in its transition/consolidate slot. No-op
          # + byte-stable when ED4ALL_NEW_BLOCK_TYPES is unset (the same flag the
          # B09 scenario_mode / debrief render scaffold rides). action=regenerate
          # on miss.
          # TODO(calibration) — flip SCENARIO_DEBRIEF_MISSING to critical after a
          # >=2-corpus FP measurement (WS3/W4 deferred-flip pattern; IB3 is the
          # single documented fastest-flip exception, this is NOT IB3).
          - gate_id: b09_debrief
            validator: lib.validators.b09_debrief.B09DebriefValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: FR-INT-06 — B09 case/scenario must end with a debrief in its transition/consolidate slot. Warning day-1; deferred critical-flip; no-op when ED4ALL_NEW_BLOCK_TYPES unset.

          # FR-INT-04 — B10 three-move discussion-protocol gate for the
          # ``discussion_prompt`` block type. Flags DISCUSSION_PROTOCOL_COLLAPSED
          # when a discussion ships a single prompt with no required peer-
          # response and no synthesize move (post -> respond -> synthesize). No-op
          # + byte-stable when ED4ALL_NEW_BLOCK_TYPES is unset (the same flag the
          # B10 three-move render scaffold rides). action=regenerate on miss.
          # TODO(calibration) — flip DISCUSSION_PROTOCOL_COLLAPSED to critical
          # after a >=2-corpus FP measurement (WS3/W4 deferred-flip pattern;
          # IB3 is the single documented fastest-flip exception, this is NOT IB3).
          - gate_id: b10_protocol
            validator: lib.validators.b10_protocol.B10ProtocolValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: FR-INT-04 — B10 three-move discussion protocol (post -> respond -> synthesize) on discussion_prompt blocks. Warning day-1; deferred critical-flip; no-op when ED4ALL_NEW_BLOCK_TYPES unset.

          # FR-A11Y-02 — interaction-block WCAG 2.1.1/2.5.7 (drag-only-no-
          # keyboard) + 1.4.1 (colour-only signalling) floor. Consumes
          # inputs['blocks'] (+ threaded block_a11y_enabled). Rides
          # ED4ALL_BLOCK_A11Y — strict no-op + byte-stable when the flag is
          # unset (same flag as IB4's per-block a11y emit). action=regenerate
          # on miss.
          # TODO(calibration) — flip DRAG_ONLY_NO_KEYBOARD + COLOR_ONLY_
          # SIGNALING to critical after a >=2-corpus FP measurement (WS3/W4
          # deferred-flip pattern; IB3 is the single documented fastest-flip
          # exception, this is NOT IB3).
          - gate_id: interactive_a11y
            validator: lib.validators.interactive_a11y.InteractiveA11yValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: FR-A11Y-02 — interaction-block WCAG 2.1.1/2.5.7 + 1.4.1. Warning day-1; deferred critical-flip; no-op when ED4ALL_BLOCK_A11Y unset.

          # FR-A11Y-03 — typed B12 callout / non-color-coding gate. Flags
          # CALLOUT_NO_KIND (untyped callout) / CALLOUT_COLOR_ONLY (color/border
          # without a visible label+icon, WCAG 1.4.1) / CALLOUT_BODY_OVERFLOW
          # (~200-char cognitive-load ceiling) / CALLOUT_MOTION (motion without a
          # reduced-motion guard). Consumes inputs['blocks']. Rides
          # ED4ALL_CALLOUT_TYPED — strict no-op + byte-stable when the flag is
          # unset (the same flag that makes the typed callout renderer emit the
          # redundant label/icon/border). action=regenerate on miss.
          # TODO(calibration) — flip the CALLOUT_* codes to critical after a
          # >=2-corpus FP measurement (WS3/W4 deferred-flip pattern; IB3 is the
          # single documented fastest-flip exception, this is NOT IB3).
          - gate_id: callout_structure
            validator: lib.validators.callout_structure.CalloutStructureValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: FR-A11Y-03 — typed B12 callout non-color coding + overflow + motion. Warning day-1; deferred critical-flip; no-op when ED4ALL_CALLOUT_TYPED unset.

          # IB6.6 — block->module->course quality-rollup GATE (framework
          # FR-07/13, §6.5). Surfaces the BlockQualityRollupAggregator's
          # course_pass / per-block-fail signal (the 3 hard gates: Accessibility
          # ==0 -> block fail; assessment-Bloom<objective -> Alignment cap 1;
          # interaction-without-feedback -> Feedback+Coherence cap 1; plus
          # mean>=2.0 AND per-dimension min-floor) as a GateResult so the
          # rollup actually GATES instead of only writing an ignored report.
          # Self-sufficient: scores the rewrite-tier blocks with the canonical
          # IB6.1 rubric scorer then rolls up via the aggregator. No-op +
          # byte-stable when ED4ALL_BLOCK_QUALITY_RUBRIC is unset (the rubric
          # scorer no-ops, so there is nothing to roll up).
          # TODO(calibration) — flip COURSE_QUALITY_ROLLUP_FAIL to critical
          # (severity: critical + on_fail: block, and set passed=course_pass in
          # the validator) so a failing rollup BLOCKS promotion (FR-07/13),
          # AFTER scripts/calibration_harness.py confirms the rubric gates' FP
          # rate on >=2 corpora (the anchored 0-3 scale must be calibrated
          # before the mean/min-floor hard gates can block early runs).
          - gate_id: block_quality_rollup
            validator: lib.validators.block_quality_rollup.BlockQualityRollupValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: IB6.6 — block->module->course quality rollup gate (course_pass / FR-07/13). Warning day-1; deferred critical-flip; no-op when ED4ALL_BLOCK_QUALITY_RUBRIC unset.

          # FR-COURSE-01 — course-level §6.5 EMERGENT-quality QA gate. Composes
          # the block->module->course rollup + the per-page block-type
          # distribution (+ the optional 06_assessments manifest) into the §6.5
          # A-F course-level signals NO per-block gate captures. KEYSTONE is
          # Section F, the interaction MIX (OSCQR item 34): a course must span
          # >=2 of {student-content (exposition/check), student-student
          # (discussion B10), student-instructor (graded/feedback B14)} ->
          # COURSE_INTERACTION_MIX_NARROW. Also flags COURSE_NO_INTEGRATION_CLOSE
          # (last module lacks a summative B13/B14 close), COURSE_TO_COVERAGE_GAP
          # (orphan terminal objective), COURSE_RETRIEVAL_RHYTHM_THIN (massed,
          # not spaced retrieval — advisory companion to retrieval_presence /
          # block_sequence_order, no recompute). Anti-fabrication: only flags
          # what real signals support. No-op + byte-stable when
          # ED4ALL_BLOCK_QUALITY_RUBRIC is unset (the rollup it composes rides
          # the same flag).
          # TODO(calibration) — flip COURSE_INTERACTION_MIX_NARROW to critical
          # (severity: critical + on_fail: block, and set passed accordingly in
          # the validator) AFTER scripts/calibration_harness.py confirms the
          # course-level FP rate on >=2 corpora (WS3/W4 deferred-flip pattern;
          # IB3 is the single documented fastest-flip exception, this is NOT IB3).
          - gate_id: course_level_qa
            validator: lib.validators.course_level_qa.CourseLevelQaValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: FR-COURSE-01 — course-level §6.5 emergent-quality (interaction-mix keystone / integration-close / cumulative-coverage / retrieval-rhythm). Warning day-1; deferred critical-flip; no-op when ED4ALL_BLOCK_QUALITY_RUBRIC unset.
          # C3-6 — course-level CROSS-WEEK distributed-practice (spacing) gate.
          # The framework §6.5 spacing axis wants a substantive concept/objective
          # REVISITED across weeks, not massed in one. Composes the per-block
          # objective ids / concept tags + their week_NN grouping (NO model load);
          # flags CONCEPT_MASSED_SINGLE_WEEK when a substantive concept (>= a few
          # blocks, >=1 retrieval/check) is taught + assessed entirely within one
          # week with no spaced revisit. Distinct from the within-module IB7.5a
          # planner spacing pass AND from course_level_qa's per-module retrieval
          # rhythm. Anti-fabrication: graceful-skips on unresolvable week info /
          # single-week course. Warning day-1; no-op + byte-stable when
          # ED4ALL_BLOCK_QUALITY_RUBRIC unset (course-level QA, same flag as
          # course_level_qa).
          # TODO(calibration) — flip CONCEPT_MASSED_SINGLE_WEEK to critical
          # (severity: critical + on_fail: block, and set passed accordingly in
          # the validator) AFTER scripts/calibration_harness.py confirms the
          # course-level FP rate on >=2 corpora (WS3/W4 deferred-flip pattern;
          # IB3 is the single documented fastest-flip exception, this is NOT IB3).
          - gate_id: cross_week_spacing
            validator: lib.validators.cross_week_spacing.CrossWeekSpacingValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: C3-6 — course-level §6.5 cross-week distributed practice (spacing). Flags a substantive concept/objective taught+assessed entirely within one week with no spaced revisit. Warning day-1; deferred critical-flip; no-op when ED4ALL_BLOCK_QUALITY_RUBRIC unset.

      # W10 (plan plans/finegrain/w10-assessments-qti-discussions-2026-06.md
      # §2.4 Option A) — pre-packaging PRODUCT-assessment synthesis. Mirror of
      # the textbook_to_course phase, adapted to course_generation's leaner
      # graph (no DART chunking / course_planning / objective_extraction
      # phases): synthesizes grounded quizzes/assignments/discussions and
      # emits QTI 1.2 / imsdt / assignment XML + manifest.json into
      # ``<export>/06_assessments/`` so ``packaging`` picks them up. Validator-
      # only phase (``agents: []``) routed by phase NAME via
      # ``MCP/core/executor.py::_PHASE_TOOL_MAPPING['assessment_synthesis']``.
      # Sits AFTER content_generation and BEFORE packaging.
      - name: assessment_synthesis
        agents: []
        parallel: false
        max_concurrent: 1
        depends_on: [content_generation]
        # Two-pass: single-pass content_generation is disabled, so depend on
        # the rewrite-tier completion gate (mirrors packaging below).
        depends_on_when_env: "COURSEFORGE_TWO_PASS=true"
        depends_on_when_env_value: [post_rewrite_validation]
        timeout_minutes: 60
        description: >
          W10 — synthesize + emit grounded quizzes/assignments/discussions as
          QTI 1.2 / imsdt / assignment XML into <export>/06_assessments/
          before packaging (product-assessment surface, §2.4 Option A).
        optional: true  # Can be skipped via generate_assessments=false

        inputs_from:
          - param: course_name
            source: workflow_params
            key: course_name
          - param: objectives_path
            source: workflow_params
            key: objectives_path
          - param: bloom_levels
            source: workflow_params
            key: bloom_levels
          - param: question_count
            source: workflow_params
            key: assessment_count

        outputs:
          - assessments_path
          - assessment_dir
          - qti_dir
          - assessment_id
          - question_count
          - chunks_path

        validation_gates:
          # W10 §7 — QTI 1.2 well-formedness + XSD conformance + answer-key
          # resolution (critical). Input router feeds
          # inputs["qti_dir"] = <export>/06_assessments.
          - gate_id: qti_well_formed
            validator: lib.validators.qti_well_formed.QtiWellFormedValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: block
              on_error: fail_closed
            description: "W10 — QTI 1.2 well-formedness + XSD conformance + answer-key resolution for synthesized quizzes."

          # W10 §6.1 — reuse the existing grounding gate on the PRODUCT
          # assessment surface (critical/block).
          - gate_id: assessment_objective_alignment
            validator: lib.validators.assessment_objective_alignment.AssessmentObjectiveAlignmentValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: block
              on_error: fail_closed
            description: Every synthesized assessment/assignment/discussion objective_id must appear in at least one chunk's learning_outcome_refs OR the synthesized objectives' id set (W10 reuse of the Wave 24 + Wave 5 W5.E union surface).

          # W10 §7 — per-TYPE grounding attribution for assignment +
          # discussion items (warning day-1; mirrors WS3 deferred-flip).
          # C3-2: the dedicated DiscussionAssignmentGroundingValidator now
          # owns this gate (per-item B10 discussion + assignment grounding:
          # each prompt must trace to a real source chunk via resolvable
          # source_chunk_ids OR an objective_id present in some chunk's
          # learning_outcome_refs). Stays WARNING; deferred critical-flip.
          - gate_id: discussion_assignment_grounded
            validator: lib.validators.discussion_assignment_grounding.DiscussionAssignmentGroundingValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: "W10 — per-type grounding for assignment + discussion items (warning day-1; DiscussionAssignmentGroundingValidator flags DISCUSSION_UNGROUNDED / ASSIGNMENT_UNGROUNDED per item; deferred critical-flip)."

          # FR-COURSE-03 — cumulative-retrieval breadth floor for the B14 final
          # graded assessment. Flags CUMULATIVE_RETRIEVAL_TOO_NARROW when the
          # final graded assessment spans < 2 terminal objectives while the
          # course defines >= 4 TOs. Strict no-op when the course has < 4 TOs.
          # Builder surfaces {assessments_path, synthesized_objectives_path}.
          # TODO(calibration) — flip CUMULATIVE_RETRIEVAL_TOO_NARROW to
          # critical after a >=2-corpus FP measurement (WS3/W4 deferred-flip
          # pattern; IB3 is the single documented fastest-flip exception, this
          # is NOT IB3).
          - gate_id: cumulative_assessment
            validator: lib.validators.cumulative_assessment.CumulativeAssessmentValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: FR-COURSE-03 — B14 final graded assessment must span >= 2 TOs when course has >= 4 TOs. Warning day-1; deferred critical-flip; no-op when < 4 TOs.

      - name: packaging
        agents: [brightspace-packager]
        parallel: true
        max_concurrent: 10
        batch_by: week
        # W10: depend on assessment_synthesis (optional, no-op when skipped)
        # so the 06_assessments/ XML is on disk before the packager runs.
        depends_on: [content_generation, assessment_synthesis]
        # Phase 3 Subtask 4: alternate dependency when two-pass is on.
        # ``_dependencies_met`` honours this via the same env-predicate
        # grammar as ``enabled_when_env``: when the predicate matches,
        # the alternate ``depends_on_when_env_value`` list replaces
        # ``depends_on`` for the dependency check. Phase 3.5 Subtask 11
        # routes two-pass packaging through post_rewrite_validation
        # rather than content_generation_rewrite directly. W10 adds
        # assessment_synthesis to the two-pass list too.
        depends_on_when_env: "COURSEFORGE_TWO_PASS=true"
        depends_on_when_env_value: [post_rewrite_validation, assessment_synthesis]
        timeout_minutes: 45

        validation_gates:
          - gate_id: imscc_structure
            validator: lib.validators.imscc.IMSCCValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: block
              on_error: fail_closed

          - gate_id: page_objectives
            validator: lib.validators.page_objectives.PageObjectivesValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: block
              on_error: fail_closed

          # Phase 4 PoC of plans/rdf-shacl-enrichment-2026-04-26.md
          # (sub-plan: plans/phase-4-validators-to-shacl.md). Parallel
          # SHACL gate alongside the Python page_objectives gate above —
          # NOT a replacement. Severity is intentionally `warning` so
          # the Python gate stays authoritative during the PoC window
          # while the SHACL output is informational. Inputs (content_dir
          # + objectives_path) are routed via the same
          # _build_page_objectives builder.
          - gate_id: page_objectives_shacl
            validator: lib.validators.shacl_runner.PageObjectivesShaclValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: "Phase 4 PoC SHACL parallel of page_objectives. Informational; Python gate remains authoritative."

      - name: validation
        agents: [oscqr-course-evaluator, quality-assurance]
        parallel: true
        max_concurrent: 2
        depends_on: [packaging]
        timeout_minutes: 30

        validation_gates:
          - gate_id: wcag_compliance
            validator: lib.validators.wcag.WCAGValidator
            severity: critical
            threshold:
              max_critical_issues: 0
              min_score: 0.9
            behavior:
              on_fail: block
              on_error: fail_closed

          - gate_id: oscqr_score
            validator: lib.validators.oscqr.OSCQRValidator
            severity: warning
            threshold:
              min_score: 0.7
            behavior:
              on_fail: warn
              on_error: warn

      - name: finalization
        agents: [brightspace-packager]
        parallel: false
        max_concurrent: 1
        depends_on: [validation]
        timeout_minutes: 30

  # RAG Training: Assessment-based training data generation
  rag_training:
    description: Train RAG on assessment data from IMSCC packages

    retry_policy:
      max_retries: 2
      retry_delay_seconds: [5, 30]
      transient_error_classes:
        - timeout
        - rate_limit
      permanent_error_classes:
        - validation_error
        - missing_content

    poison_pill:
      threshold: 3
      window_seconds: 300

    phases:
      - name: extraction
        agents: [assessment-extractor]
        parallel: false
        max_concurrent: 1
        depends_on: []
        timeout_minutes: 45

      - name: indexing
        agents: [rag-indexer]
        parallel: false
        max_concurrent: 1
        depends_on: [extraction]
        timeout_minutes: 60

      - name: assessment_generation
        agents: [assessment-generator]
        parallel: true
        max_concurrent: 5
        depends_on: [indexing]
        timeout_minutes: 90
        batch_timeout_minutes: 30

        validation_gates:
          - gate_id: assessment_quality
            validator: lib.validators.assessment.AssessmentQualityValidator
            severity: critical
            threshold:
              min_score: 0.8
              max_critical_issues: 0
            # Wave 6 W6.C: per-question-type threshold overlay. Operator
            # surface for the W6.A AssessmentQualityValidator's per-type
            # quality matrix; merges via the Wave 78 setdefault pattern at
            # MCP/hardening/validation_gates.py:266-271 (gate.config flows
            # into validator inputs as ``per_question_type_thresholds``).
            # Day-1 values mirror the validator's hardcoded
            # ``_PER_QUESTION_TYPE_THRESHOLDS`` so this block is a
            # round-trip no-op until an operator tunes it. Per-type gate
            # failures still emit at warning severity from inside the
            # validator (-0.05 score deduction); the gate stays critical
            # only on the legacy aggregate score / critical-issue
            # thresholds above. Calibration micro-wave (§5 of plan
            # plans/wave6-per-question-type-matrix-2026-05.md) flips
            # per-type warnings to critical once the corpus baseline
            # stabilises.
            config:
              per_question_type_thresholds:
                multiple_choice:
                  stem_diversity: 0.75
                  correct_answer_diversity: 0.65
                  distractor_template_max_ratio: 0.25
                  min_stem_chars: 12
                true_false:
                  stem_diversity: 0.50
                  correct_answer_diversity: 0.40
                  distractor_template_max_ratio: 1.0
                  min_stem_chars: 10
                short_answer:
                  stem_diversity: 0.65
                  correct_answer_diversity: 0.55
                  distractor_template_max_ratio: 1.0
                  min_stem_chars: 12
                essay:
                  stem_diversity: 0.55
                  correct_answer_diversity: 0.50
                  distractor_template_max_ratio: 1.0
                  min_stem_chars: 15
                fill_in_blank:
                  stem_diversity: 0.65
                  correct_answer_diversity: 0.55
                  distractor_template_max_ratio: 0.30
                  min_stem_chars: 10
            behavior:
              on_fail: block
              on_error: fail_closed

          - gate_id: bloom_alignment
            validator: lib.validators.bloom.alignment.BloomAlignmentValidator
            severity: warning
            threshold:
              min_alignment_score: 0.7
            behavior:
              on_fail: warn
              on_error: warn

          - gate_id: leak_check
            validator: lib.validators.leak_check.LeakCheckValidator
            severity: critical
            threshold:
              max_leaks: 0
              # §4.7 corpus-wide boilerplate sub-check. Warning-only today;
              # flips to blocking in the v1.0 severity pass (VERSIONING.md §3).
              max_boilerplate_chunk_fraction: 0.10
              boilerplate_ngram_tokens: 15
            behavior:
              on_fail: block
              on_error: fail_closed

          - gate_id: outcome_ref_integrity
            validator: lib.validators.leak_check.LeakCheckValidator
            # Warning in v0.1.x — flips to `critical` in the follow-up PR
            # once mini_course_clean/ runs green per VERSIONING.md §3.
            severity: warning
            threshold:
              max_broken_refs: 0
            behavior:
              on_fail: warn
              on_error: warn

          - gate_id: content_fact_check
            validator: lib.validators.content_facts.ContentFactValidator
            severity: warning
            threshold:
              max_fact_flags: 0
            behavior:
              on_fail: warn
              on_error: warn

          - gate_id: question_quality
            validator: lib.validators.question_quality.QuestionQualityValidator
            severity: critical
            threshold:
              min_score: 0.6
            behavior:
              on_fail: block
              on_error: fail_closed

      - name: validation
        agents: [assessment-validator]
        parallel: true
        max_concurrent: 5
        depends_on: [assessment_generation]
        timeout_minutes: 30

        validation_gates:
          - gate_id: final_quality
            validator: lib.validators.assessment.FinalQualityValidator
            severity: critical
            threshold:
              min_score: 0.85
            behavior:
              on_fail: block
              on_error: fail_closed

  # Textbook to Course: Unified pipeline (DART -> Courseforge -> Trainforge)
  textbook_to_course:
    description: End-to-end textbook-to-course pipeline (DART -> Courseforge -> Trainforge)

    retry_policy:
      max_retries: 3
      retry_delay_seconds: [5, 30, 120]
      transient_error_classes:
        - timeout
        - rate_limit
        - connection_error
      permanent_error_classes:
        - validation_error
        - missing_input
        - corrupt_pdf

    poison_pill:
      threshold: 3
      window_seconds: 300

    phases:
      - name: dart_conversion
        agents: [dart-converter]
        parallel: true
        max_concurrent: 4
        depends_on: []
        timeout_minutes: 90
        description: Convert PDF textbooks to accessible HTML via multi-source synthesis

        # REC-CTR-05: Explicit parameter routing (was hardcoded in
        # MCP/core/workflow_runner.py::PHASE_PARAM_ROUTING).
        inputs_from:
          - param: course_code
            source: workflow_params
            key: course_name

        # REC-CTR-05: Explicit output keys (was hardcoded in
        # MCP/core/workflow_runner.py::PHASE_OUTPUT_KEYS).
        # Wave 32 Deliverable B: surface html_path + html_paths
        # (router canonical keys) so DartMarkersValidator gate
        # builder stops reporting ``missing inputs: html_path``.
        outputs:
          - output_path
          - output_paths
          - html_path
          - html_paths
          - success
          - html_length

        # REC-CTR-06: DART markers gate on textbook pipeline first phase.
        validation_gates:
          - gate_id: dart_markers
            validator: lib.validators.dart_markers.DartMarkersValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: block
              on_error: fail_closed
            description: Ensure DART HTML emits skip-link, role=main, aria-labelledby sections, and DART semantic classes

      - name: staging
        agents: [textbook-stager]
        parallel: false
        max_concurrent: 1
        depends_on: [dart_conversion]
        timeout_minutes: 10
        description: Stage DART outputs to Courseforge inputs directory

        inputs_from:
          - param: run_id
            source: workflow_params
            key: run_id
          - param: dart_html_paths
            source: phase_outputs
            phase: dart_conversion
            output: output_paths
          - param: course_name
            source: workflow_params
            key: course_name

        outputs:
          - staging_dir
          - staged_files
          - file_count

      # Phase 7b ST 10: chunking phase — emits the DART chunkset
      # (LibV2/courses/<slug>/dart_chunks/chunks.jsonl + manifest.json)
      # by running Trainforge.chunker.chunk_content over staged DART HTML
      # before objectives are extracted. Downstream concept_extraction
      # (Phase 6 ST 11/12) consumes dart_chunks_path directly per the
      # ST 14.5 reconciliation, eliminating the inline v4-chunk
      # projection that previously lived inside _run_concept_extraction.
      - name: chunking
        agents: [dart-chunker]
        parallel: false
        max_concurrent: 1
        depends_on: [staging]
        timeout_minutes: 15
        description: Emit DART chunkset (Phase 7b ST 10/11)

        inputs_from:
          - param: course_name
            source: workflow_params
            key: course_name
          - param: staging_dir
            source: phase_outputs
            phase: staging
            output: staging_dir
          # Phase 8 ST 3: route the optional ``libv2_root`` workflow
          # param into ``_run_dart_chunking`` so ops topologies that
          # mount LibV2 at a non-default location can override the
          # in-tree default. Default unset → the helper falls through
          # to ``ED4ALL_LIBV2_ROOT`` env var > in-tree ``LibV2/``.
          - param: libv2_root
            source: workflow_params
            key: libv2_root

        outputs:
          - dart_chunks_path
          - dart_chunks_sha256

        # Phase 7b ST 13 (Worker W13): ChunksetManifestValidator wires
        # here. Forward-reference — validator class lands in parallel
        # with this phase block; the runner resolves the import at
        # execution time so a missing class only surfaces when the gate
        # actually runs. Severity warning initially per plan; promotion
        # to critical follows once Worker W13 calibrates against a
        # clean corpus rebuild.
        validation_gates:
          - gate_id: chunkset_manifest
            validator: lib.validators.chunkset_manifest.ChunksetManifestValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn

          # IB4.2 — gate the data-only chunk WCAG fields (wcag_block_status /
          # figure_alt) on the DART chunkset. Warning day-1; legacy corpora
          # (fields absent) pass clean via WCAG_FIELDS_ABSENT.
          # TODO(calibration) — flip to critical once a >=2-corpus measurement
          # shows the `flagged`-rate is a true defect signal, not SemantiK-noise.
          - gate_id: chunk_wcag_status
            validator: lib.validators.chunk_wcag_status.ChunkWcagStatusValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: IB4.2 — DART-chunkset WCAG-field gate (no flagged chunk; figure chunks carry figure_alt). Warning day-1; deferred critical-flip.

      - name: objective_extraction
        agents: [textbook-ingestor]
        parallel: false
        max_concurrent: 1
        depends_on: [chunking]
        timeout_minutes: 60
        description: Extract structure from staged DART HTML into textbook_structure.json (Wave 24)

        inputs_from:
          - param: course_name
            source: workflow_params
            key: course_name
          - param: objectives_path
            source: workflow_params
            key: objectives_path
          - param: duration_weeks
            source: workflow_params
            key: duration_weeks
          # Wave 24 HIGH-6: when --weeks is unset, auto-scale to max(8, chapters).
          - param: duration_weeks_explicit
            source: workflow_params
            key: duration_weeks_explicit
          - param: staging_dir
            source: phase_outputs
            phase: staging
            output: staging_dir

        outputs:
          - project_id
          - project_path
          - textbook_structure_path
          - chapter_count
          - duration_weeks
          - source_file_count

        # Three-stage textbook synthesis, Wave B (plan §8 row 1):
        # TextbookOutlineValidator audits the Stage-1 enrichment keys
        # (semantic_outline / draft_terminal_objectives) folded into
        # textbook_structure.json when TEXTBOOK_SYNTHESIS_PROVIDER is
        # set. Skips-with-pass when the keys are absent so default-off
        # runs are unaffected. Day-1 warning severity per the standing
        # calibration-debt pattern (mirrors concept_graph /
        # abcd_verb_alignment); promote to critical after a
        # clean-corpus calibration run.
        validation_gates:
          # 2026-06-10 PROMOTED critical (was: warning-severity day-1
          # per the calibration-debt pattern, "promote to critical after
          # a clean-corpus calibration run"). Condition met: passes on 5
          # clean-corpus calibration runs, 2026-06 (see
          # docs/validation/gates.md). Skips-with-pass when
          # TEXTBOOK_SYNTHESIS_PROVIDER is unset (default-off runs emit
          # textbook_structure.json byte-identical and are unaffected),
          # so promotion adds no risk to legacy / synthesis-off runs.
          - gate_id: textbook_outline_enrichment
            validator: lib.validators.textbook_structure.TextbookOutlineValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: block
              on_error: warn

      - name: source_mapping
        agents: [source-router]
        parallel: false
        max_concurrent: 1
        depends_on: [objective_extraction]
        timeout_minutes: 30
        description: Map DART source blocks to Courseforge module pages (Wave 9)

        inputs_from:
          - param: project_id
            source: phase_outputs
            phase: objective_extraction
            output: project_id
          - param: staging_dir
            source: phase_outputs
            phase: staging
            output: staging_dir
          - param: textbook_structure_path
            source: phase_outputs
            phase: objective_extraction
            output: textbook_structure_path

        outputs:
          - source_module_map_path
          - source_chunk_ids

      - name: course_planning
        agents: [course-outliner]
        parallel: false
        max_concurrent: 1
        # Phase-ordering fix (Option A1): course_planning now runs BEFORE
        # concept_extraction so fresh runs have synthesized objectives (and
        # LO-backfilled chunks) available at graph-build time. Depends on
        # source_mapping (source_module_map.json) and chunking directly —
        # the LO-refs backfill at the planner tail reads
        # LibV2/courses/<slug>/dart_chunks/chunks.jsonl (previously this was
        # transitive via concept_extraction's dependence on chunking).
        depends_on: [source_mapping, chunking]
        timeout_minutes: 60
        description: Synthesize real TO/CO objectives + persist synthesized_objectives.json (Wave 24)

        inputs_from:
          - param: project_id
            source: phase_outputs
            phase: objective_extraction
            output: project_id
          - param: course_name
            source: workflow_params
            key: course_name
          - param: objectives_path
            source: workflow_params
            key: objectives_path
          - param: duration_weeks
            source: workflow_params
            key: duration_weeks
          # Wave 40: route ``duration_weeks_explicit`` so the planner
          # honors the extractor's auto-scaled value in
          # ``project_config.json`` when ``--weeks`` was unset. Without
          # this, ``_plan_course_structure``'s precedence check sees
          # the default ``True`` and clobbers the auto-scaled 8 with the
          # stale routed ``duration_weeks=12`` from workflow_params.
          - param: duration_weeks_explicit
            source: workflow_params
            key: duration_weeks_explicit
          - param: source_module_map_path
            source: phase_outputs
            phase: source_mapping
            output: source_module_map_path

        outputs:
          - project_id
          - synthesized_objectives_path
          - objective_ids
          - terminal_count
          - chapter_count

        # Phase 6 ST 4.5: gate the synthesized LO set on ABCD verb-Bloom
        # alignment. Phase 6 landed as warning so legacy corpora without
        # ABCD don't fail closed; Phase 7+ promotes to critical once
        # corpus calibration confirms safe.
        # 2026-06-10 PROMOTED critical (condition "once corpus calibration
        # confirms safe" met): passes on 5 clean-corpus calibration runs,
        # 2026-06 (see docs/validation/gates.md). The validator
        # graceful-degrades to a warning-
        # severity ABCD_MISSING issue (passed=True) for legacy LOs without
        # an `abcd` block, so promoting severity does NOT fail-close legacy
        # corpora — only a real verb/Bloom MISMATCH on an ABCD-authored LO
        # now blocks.
        validation_gates:
          - gate_id: abcd_verb_alignment
            validator: lib.validators.abcd_objective.AbcdObjectiveValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: block
              on_error: warn
          # Wave 1.6 W1.6.C: per-objective source-attribution
          # consistency walk. Resolves each LO's source_refs against
          # the dual universe of (textbook_structure chapter / section
          # IDs) ∪ (DART chunkset chunk-id universe). Wave 1.6 ships
          # warning-severity day-1 to preserve back-compat with the
          # RDF/SHACL calibration corpus's existing emit;
          # promotion to CRITICAL waits for future-wave calibration
          # data per plan §6.3 risk note. Day-1 default
          # ``require_to_attribution=false`` keeps TOs from firing
          # OBJECTIVE_MISSING_SOURCE_REFS so legacy archives where TOs
          # have no source_refs continue to validate.
          # Inputs are resolved by the gate-input router builder
          # registered against this validator path in
          # MCP/hardening/gate_input_routing.py — the meta-schema
          # forbids gate-level inputs blocks.
          - gate_id: objective_source_refs
            validator: lib.validators.objective_source_refs.ObjectiveSourceRefValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            config:
              require_to_attribution: false

          # W4 — LO-statement NLI entailment against the LO's cited chunk(s).
          # The GATE counterpart to W2's in-synthesis NLI-grounding filter
          # (W2 filters at generation time; this gates the landed LO set).
          # Sits ALONGSIDE the resolution-only objective_source_refs gate.
          # Reuses score_groundedness. Day-1 SHADOW (warning): computes +
          # captures, does not gate. Graceful-degrade identical to claim_support
          # (NLI deps absent -> warning passed=True; strict -> raise) PLUS a
          # no-universe warning when no chunks.jsonl resolves.
          # TODO(calibration): promote to critical after
          # state/calibration/objective_entailment_calibration.json
          # decision:promote_critical — flip is severity: critical,
          # behavior.on_fail: block, config.shadow: false. The calibration run
          # needs a live local-7B synthesis pass (DEFERRED); the orchestrator
          # runs §4 calibration then flips.
          - gate_id: objective_entailment
            validator: lib.validators.objective_entailment.ObjectiveEntailmentValidator
            severity: warning                  # SHADOW day-1 -> critical post-calibration (§4)
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: fail_closed
            config:
              shadow: true
              require_to_entailment: false     # mirrors objective_source_refs require_to_attribution day-1 default
              thresholds:
                entailment_floor: 0.70
                contradiction_floor: 0.50
                objective_entailment_rate_floor: 1.0
            description: "W4 — LO-statement NLI entailment vs cited chunks. SHADOW until §4 calibration, then critical."
          # Three-stage textbook synthesis (plan §8 row 3): gate the
          # Stage-2 per-chapter CO synthesis + reconciliation output.
          # Skips-with-pass when TEXTBOOK_SYNTHESIS_PROVIDER is unset
          # (the deterministic synthesizer ran; no chapter_text-bearing
          # chapters[] to audit).
          # 2026-06-10 PROMOTED critical (was: warning-severity day-1,
          # "promotes to critical after a clean-corpus calibration run").
          # Condition met: passes on 4 clean-corpus calibration runs,
          # 2026-06 (see docs/validation/gates.md). Skip-with-
          # pass on default-off runs keeps legacy / synthesis-off runs
          # unaffected.
          - gate_id: chapter_objective_coverage
            validator: lib.validators.chapter_objective_coverage.ChapterObjectiveCoverageValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: block
              on_error: warn
          # Fail-fast terminal-coverage gate. Catches orphan terminal
          # objectives (no chapter objective rolling up / chapter not in
          # textbook_structure) at planning time, so the critical
          # UNCOVERED_TERMINAL_OUTCOME failure at libv2_archival can never
          # reoccur silently. Critical / block: a terminal that downstream
          # content generation cannot cover is a hard inconsistency.
          # Graceful-degrades to pass when objectives are empty or the
          # textbook_structure needed to adjudicate a CO-less course is
          # absent (preserving reuse/legacy runs).
          - gate_id: terminal_objective_coverage
            validator: lib.validators.terminal_objective_coverage.TerminalObjectiveCoverageValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: block
              on_error: fail_closed
          # WS3 — CO<->TO semantic-alignment DETECTION gate. The structural
          # terminal_objective_coverage gate above is a roll-up check only
          # ("does every TO have >=1 CO pointing at it"); it NEVER measures
          # whether the CO->TO assignment is semantically meaningful. On the
          # broken run all 62 COs carried a populated terminal_id
          # (force-assigned floorlessly by backlink_cos_to_tos), so the
          # structural gate passed via the genuine orphan-check path even
          # though the assignments were near-random — a silent-pass loophole.
          # This gate recomputes cosine(co.statement, assigned_to.statement)
          # per chapter objective and flags weak links. It is detection, NOT
          # the cure (WS1's bottom-up TO derivation is the cure), and fires on
          # ~80%+ of COs on the current run, so it lands warning-severity
          # day-1.
          # TODO(calibration): promote to critical after WS1 proves the
          # recomputed weak-link rate <= 0.10 on >=2 corpora — flip is
          # severity: critical, behavior.on_fail: block, and
          # CO_TERMINAL_WEAK_LINK_RATE_HIGH -> critical. NOT in WS3 scope.
          - gate_id: co_terminal_alignment
            validator: lib.validators.co_terminal_alignment.CoTerminalAlignmentValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn        # embedding-validator convention (cf. objective_source_refs), NOT fail_closed
            config:
              threshold: 0.45
              weak_rate_warn: 0.30
            description: "WS3 — CO<->TO semantic-alignment detection gate (recompute cosine). SHADOW/warning day-1; closes the structural-roll-up silent-pass loophole. Critical flip DEFERRED (TODO calibration, post-WS1)."
          # WS6a — Source->objective coverage-audit gate. Embeds each
          # content-bearing textbook section (chapters[].sections[],
          # section_text len > ~40) and asserts >=1 synthesized objective
          # (CO or TO) covers it above a cosine floor. A section no objective
          # rolls up to is real instructional content that downstream content
          # generation never authors a page for — it silently vanishes from the
          # course. This gate surfaces that gap at planning time instead of at
          # archival. Reuses the _build_chapter_objective_coverage_inputs builder
          # (same synthesized_objectives + textbook_structure inputs). Graceful
          # no-op pass on empty/absent inputs; EMBEDDING_DEPS_MISSING degrade
          # when [embedding] extras are absent.
          # DE-RISK PROOF (2026-06-17): on the real corpus 135/135 content
          # sections are covered at floor 0.45 (mean cosine 0.73), so this
          # corpus passes clean — the gate is a guardrail for OTHER corpora.
          # TODO(calibration): calibrate the floor UP toward ~0.55 on >=2
          # corpora before any critical flip (the flip is severity: critical,
          # behavior.on_fail: block, and SOURCE_COVERAGE_LOW -> critical).
          # NOT in WS6a scope.
          #
          # I3 CHUNK ARM — a SECOND, DISTINCT coverage arm on the same gate
          # (codes SOURCE_CHUNK_UNCITED / SOURCE_CHUNK_COVERAGE_LOW). It is pure
          # set-membership over the DART chunkset: a content-bearing chunk cited
          # by NO synthesized objective's source_chunk_ids is flagged. This
          # measures the chunk-level citation gap the (already-passing 135/135)
          # section-level cosine arm is BLIND to — on the reference corpus 19/76
          # content chunks ended up cited by no CO after single-link dedup
          # chained distinct skills. The chunk arm runs WITHOUT embeddings, so
          # EMBEDDING_DEPS_MISSING does not suppress it. ``dart_chunks_path`` is
          # routed into the gate inputs via _build_chapter_objective_coverage_inputs.
          # TODO(calibration): promote the chunk arm to critical (flip
          # SOURCE_CHUNK_COVERAGE_LOW -> critical, behavior.on_fail: block)
          # after ED4ALL_OBJECTIVE_SOURCE_BACKFILL drives the uncited-content
          # rate <= max_uncited_chunk_rate on >=2 corpora. Day-1 warning.
          - gate_id: source_coverage
            validator: lib.validators.source_coverage.SourceCoverageValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn        # embedding-validator convention (cf. co_terminal_alignment), NOT fail_closed
            config:
              coverage_floor: 0.45
              max_uncovered_rate: 0.15
              max_uncited_chunk_rate: 0.10   # I3 chunk arm — DISTINCT from max_uncovered_rate
            description: "WS6a section arm (section->nearest-objective cosine) + I3 chunk arm (content-chunk citation set-membership, embedding-free, DISTINCT codes). Warning day-1; surfaces source material no objective covers/cites. Critical flips DEFERRED (TODO calibration)."

      # concept_extraction phase — builds the pedagogy/concept graph from
      # the staged DART output + DART chunkset. Phase-ordering fix
      # (Option A1): this phase now runs AFTER course_planning so the
      # LO-driven typed-edge rules (prerequisite_from_lo_order,
      # targets_concept_from_lo) and the LO-backfilled chunkset are
      # available on FRESH runs — course_planning has minted
      # synthesized_objectives.json and backfilled chunk
      # learning_outcome_refs by the time the graph is built, which fixes
      # the degraded "related_to"-dominated graph on runs without
      # --reuse-objectives. Reuse runs still pin objectives via the
      # reuse_objectives_path route (candidate #1) ahead of the
      # course_planning-emitted synthesized_objectives_path.
      # Declared position matters: it sits between course_planning and
      # content_generation so Kahn's tie-break (declaration order) keeps
      # concept_extraction before content_generation. libv2_archival
      # routes concept_graph_sha256 from this phase (later in declaration
      # order, so the inputs_from reference still resolves).
      - name: concept_extraction
        agents: [pedagogy-graph-builder]
        parallel: false
        max_concurrent: 1
        depends_on: [course_planning, chunking]
        timeout_minutes: 30
        description: Build pedagogy/concept graph from staged DART output (Phase 6 ST 11/12)

        inputs_from:
          - param: project_id
            source: phase_outputs
            phase: objective_extraction
            output: project_id
          - param: course_name
            source: workflow_params
            key: course_name
          - param: staging_dir
            source: phase_outputs
            phase: staging
            output: staging_dir
          # Phase 7b ST 14.5: consume the upstream DART chunkset from
          # the chunking phase. _run_concept_extraction loads chunks
          # from this path when present and skips the legacy inline
          # projection of *_synthesized.json sidecars. Absent / unreadable
          # falls through to the legacy projection (back-compat).
          - param: dart_chunks_path
            source: phase_outputs
            phase: chunking
            output: dart_chunks_path
          # Three-stage textbook synthesis — Stage 3 (Wave C). Route the
          # objective_extraction phase's textbook_structure.json so
          # _run_concept_extraction can read chapters[].chapter_text and
          # dispatch the per-chapter concept-synthesis calls when
          # TEXTBOOK_SYNTHESIS_PROVIDER is set. Default-off: the helper
          # ignores this input entirely when the env var is unset.
          - param: textbook_structure_path
            source: phase_outputs
            phase: objective_extraction
            output: textbook_structure_path
          # Phase 8 ST 3: route the optional ``libv2_root`` workflow
          # param into ``_run_concept_extraction`` so ops topologies
          # that mount LibV2 at a non-default location can override the
          # in-tree default. Default unset → the helper falls through
          # to ``ED4ALL_LIBV2_ROOT`` env var > in-tree ``LibV2/``.
          - param: libv2_root
            source: workflow_params
            key: libv2_root
          # Objectives resolution candidate #1: the --reuse-objectives JSON
          # (when supplied) so a reuse run pins the LO-dependent typed-edge
          # rules to the operator's verbatim objectives doc.
          - param: objectives_path
            source: workflow_params
            key: reuse_objectives_path
          # Objectives resolution candidate #2 (fresh-run path): the
          # synthesized_objectives.json emitted by course_planning. Because
          # this phase now runs AFTER course_planning, fresh runs without
          # --reuse-objectives get a real course/learning_outcomes ordering
          # here, so the LO-dependent typed-edge rules fire and the
          # concept_objective_linker can populate keyConcepts[].
          - param: synthesized_objectives_path
            source: phase_outputs
            phase: course_planning
            output: synthesized_objectives_path

        outputs:
          - concept_graph_path
          - concept_graph_sha256
          # Three-stage textbook synthesis — Stage 3 (Wave C). Optional;
          # written only when TEXTBOOK_SYNTHESIS_PROVIDER is set. Sibling
          # of concept_graph_semantic.json. Audited by the
          # domain_concept_vocabulary gate below.
          - domain_concept_vocabulary_path

        # Phase 6 ST 14 (Worker K): ConceptGraphValidator wires here.
        # Forward-reference — validator class lands in parallel; the
        # runner resolves the import at execution time so missing-class
        # only surfaces when the gate actually runs. Severity warning
        # initially per plan; promotion to critical follows once Worker
        # K calibrates against a clean corpus rebuild.
        validation_gates:
          - gate_id: concept_graph
            validator: lib.validators.concept_graph.ConceptGraphValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
          # Three-stage textbook synthesis — Stage 3 (Wave C), plan §8
          # row 2. Audits the Stage-3 domain_concept_vocabulary.json
          # artifact. Skips-with-pass when no vocabulary artifact exists
          # (default-off run, TEXTBOOK_SYNTHESIS_PROVIDER unset).
          # 2026-06-10 PROMOTED critical (was: warning-severity day-1 per
          # the calibration-debt pattern). Condition met: passes on 5
          # clean-corpus calibration runs, 2026-06 (see
          # docs/validation/gates.md). Skip-with-pass on default-off
          # runs keeps legacy / synthesis-off runs unaffected.
          - gate_id: domain_concept_vocabulary
            validator: lib.validators.domain_concept_vocabulary.DomainConceptVocabularyValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: block
              on_error: warn

      - name: content_generation
        agents: [content-generator]
        parallel: true
        max_concurrent: 10
        batch_by: week
        depends_on: [course_planning]
        timeout_minutes: 120
        batch_timeout_minutes: 30
        description: Generate course content modules
        # Phase 3 Subtask 3: legacy single-pass content_generation
        # disables itself when the new two-pass router is engaged.
        # Default off so legacy runs stay byte-stable.
        enabled_when_env: "COURSEFORGE_TWO_PASS!=true"

        inputs_from:
          - param: project_id
            source: phase_outputs
            phase: objective_extraction
            output: project_id
          - param: source_module_map_path
            source: phase_outputs
            phase: source_mapping
            output: source_module_map_path
          - param: staging_dir
            source: phase_outputs
            phase: staging
            output: staging_dir
          # Wave 40: route ``duration_weeks_explicit`` for the same
          # reason as ``course_planning`` — ``_generate_course_content``
          # gates its ``project_config.duration_weeks`` precedence on
          # this flag. Pre-Wave-40 the absence of the flag in kwargs
          # let the default ``True`` clobber the auto-scaled value,
          # producing 12 week directories on a corpus that extractor
          # had auto-scaled to 8.
          - param: duration_weeks_explicit
            source: workflow_params
            key: duration_weeks_explicit

        # Wave 32 Deliverable B: add page_paths + content_dir so the
        # ContentGroundingValidator + PageObjectivesValidator gate
        # builders pick them up. Pre-Wave-32 both gates silently
        # skipped with ``missing inputs: page_paths / content_dir``.
        outputs:
          - project_id
          - content_paths
          - page_paths
          - content_dir
          - weeks_prepared
          # Anti-silent-template guard provenance (ContentAuthorshipValidator).
          - generator_mode
          - template_fallback_fired
          - content_generation_provenance_path

        validation_gates:
          - gate_id: content_structure
            validator: lib.validators.content.ContentStructureValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn

          - gate_id: source_refs
            validator: lib.validators.source_refs.PageSourceRefValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: block
              on_error: fail_closed
            # Wave4-I10 (follows Wave4-W27 / ffe517d): EMPTY_SOURCE_REFS
            # GateIssue is now critical-severity in the validator itself,
            # so a page that emits ZERO `data-cf-source-ids` attrs fails
            # this gate. Empty-string `data-cf-source-ids=""` remains
            # allowed per the Wave-27 boilerplate contract.
            description: Verify every emitted sourceId resolves against the DART staging manifest, and that every scanned page carries at least one data-cf-source-ids attribute (empty-string allowed) per Wave-27 (Wave 9 + Wave4-I10)

          # Wave 31 — ContentGroundingValidator. Catches the "empty
          # generated course" failure mode the ``SIM_RUN_01`` sim
          # produced: 48 weekly pages with < 80 words each, empty
          # objectives lists, and copy-pasted activity prompts. Nothing
          # caught that as "empty content" until this gate landed.
          - gate_id: content_grounding
            validator: lib.validators.content_grounding.ContentGroundingValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: block
              on_error: fail_closed
            description: Verify every non-trivial paragraph in generated HTML is grounded in DART source (Wave 31)

          # Anti-silent-template guard. The deterministic generate_week
          # template emitter must never silently stand in for real LLM
          # content authoring in a real run. Blocks when the template path
          # fired AND LLM authoring was intended (COURSEFORGE_PROVIDER /
          # COURSEFORGE_TWO_PASS / ED4ALL_AGENT_DISPATCH); warns otherwise.
          # Opt out with COURSEFORGE_ALLOW_TEMPLATE_EMITTER=1.
          - gate_id: content_authorship
            validator: lib.validators.content_authorship.ContentAuthorshipValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: block
              on_error: fail_closed
            description: Block the deterministic template emitter from passing as LLM-authored content in a real run

          # W3 — per-block synthesis-manifest RESOLUTION gate (single-pass
          # mirror of the post_rewrite_validation binding). The legacy
          # single-pass content_generation path emits HTML directly without a
          # materialized Block list, so block_synthesis_manifest.jsonl is
          # written only by the two-pass rewrite tier (_emit_block_synthesis_
          # manifest). The validator's graceful-pass arm (no manifest + no
          # Block-list) keeps this binding a no-op on a pure single-pass run;
          # it fires MANIFEST_FILE_MISSING only if 03_content_development/ is
          # populated AND a manifest was expected. Day-1 SHADOW (warning) so a
          # legacy single-pass run is never blocked before the emission is
          # proven on a live run.
          # TODO(integration): flip to critical (severity: critical,
          # behavior.on_fail: block) after a live run confirms emission.
          - gate_id: manifest_completeness
            validator: lib.validators.manifest_completeness.ManifestCompletenessValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            config:
              require_concept_tags: false   # warning day-1; flip to critical after a shaded run (§3.4)
            description: >
              W3 — assert every synthesized block carries a complete, well-formed
              synthesis manifest. RESOLUTION only — NOT entailment. SHADOW/warning
              day-1 until a live run proves the emission.

      # Phase 3 Subtask 3: two-pass router phases. Engaged when
      # ``COURSEFORGE_TWO_PASS=true`` is set in the environment;
      # otherwise the legacy ``content_generation`` phase above runs
      # instead. The three phases form an outline -> validate -> rewrite
      # loop: outline emits Block scaffolds, inter_tier_validation
      # runs structural validators on the outline tier, rewrite emits
      # the final HTML pages.
      - name: content_generation_outline
        agents: [content-generator]
        # NOTE: parallel/batch_by intentionally disabled. The handler
        # ``MCP/tools/pipeline_tools.py::_run_content_generation_outline``
        # iterates ``for week_num in range(1, duration_weeks + 1)``
        # internally with no ``week_range`` slicing, so dispatching N
        # parallel tasks would emit N² LLM calls. Re-enable only after
        # the handler accepts a ``week_range`` kwarg.
        parallel: false
        max_concurrent: 1
        depends_on: [course_planning, source_mapping, staging]
        timeout_minutes: 30
        batch_timeout_minutes: 10
        description: Phase 3 — outline-tier Block emit (terse provider, no HTML body)
        enabled_when_env: "COURSEFORGE_TWO_PASS=true"

        inputs_from:
          - param: project_id
            source: phase_outputs
            phase: objective_extraction
            output: project_id
          - param: source_module_map_path
            source: phase_outputs
            phase: source_mapping
            output: source_module_map_path
          - param: staging_dir
            source: phase_outputs
            phase: staging
            output: staging_dir
          - param: duration_weeks_explicit
            source: workflow_params
            key: duration_weeks_explicit
          - param: workflow_type
            source: workflow_params
            key: workflow_type

        outputs:
          - blocks_outline_path
          - project_id
          - weeks_prepared
          - outline_chunks_path
          - outline_objectives_path

      - name: inter_tier_validation
        # No agent — runs Python validators only. Phase 4 Subtask 1:
        # the workflow runner synthesizes a single virtual task for
        # ``agents: []`` phases registered in
        # ``MCP.core.executor._PHASE_TOOL_MAPPING`` so the dedicated
        # phase handler (``run_inter_tier_validation``) lands its
        # blocks-validated / blocks-failed JSONL output to disk in
        # addition to running the validation_gates chain below.
        agents: []
        parallel: false
        max_concurrent: 1
        depends_on: [content_generation_outline]
        timeout_minutes: 5
        description: Phase 3 — run structural validators on the outline tier
        enabled_when_env: "COURSEFORGE_TWO_PASS=true"

        inputs_from:
          - param: blocks_outline_path
            source: phase_outputs
            phase: content_generation_outline
            output: blocks_outline_path
          - param: project_id
            source: phase_outputs
            phase: objective_extraction
            output: project_id

        outputs:
          - blocks_validated_path
          - blocks_failed_path

        # Initially warning-severity per Phase 3 §A — promoted to
        # block in a follow-up wave once the outline-tier validators
        # have stable false-positive rates on a real corpus.
        # Subtask 52: validators routed through the Block-input
        # adapters in Courseforge.router.inter_tier_gates so the
        # workflow runner can consume the outline-tier Block list
        # directly (the legacy lib.validators.* surface targets the
        # synthesis-side instruction_pairs.jsonl + page-HTML inputs,
        # which the outline tier doesn't produce yet).
        validation_gates:
          # 2026-06-10 REVERTED critical (was: 2026-05-14 TEMP critical →
          # warning for the outline-tier block validators that failed
          # against escalated-only block sets / Wave-7 objective short-
          # circuit). Revert condition satisfied: the Block*Validator
          # adapters now honor block.escalation_marker the way the
          # packager does — skip ONLY a marker + EMPTY tombstone (the
          # ship-exclusion predicate at pipeline_tools.py:5226) via
          # inter_tier_gates._is_unshipped_escalation_tombstone, while a
          # marker + content *salvaged* block stays on the audit path —
          # so an escalated-tombstone corpus no longer trips these gates.
          - gate_id: outline_curie_anchoring
            validator: Courseforge.router.inter_tier_gates.BlockCurieAnchoringValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: block
              on_error: warn
            description: Phase 3 inter-tier — verify outline-tier Blocks anchor on a CURIE per §3

          - gate_id: outline_content_type
            validator: Courseforge.router.inter_tier_gates.BlockContentTypeValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: block
              on_error: warn
            description: Phase 3 inter-tier — verify outline-tier Block content_type stays in the canonical 8-value enum

          - gate_id: outline_page_objectives
            # 2026-06-10 REVERTED critical (was: 2026-05-14 TEMP critical
            # → warning to allow the workflow to continue past escalated
            # objective blocks). Revert condition satisfied:
            # BlockPageObjectivesValidator now skips ONLY marker + EMPTY
            # tombstones via inter_tier_gates._is_unshipped_escalation_tombstone
            # (the packager ship-exclusion predicate), so it no longer
            # fires action=block against escalated EMPTY content; a
            # marker + content salvaged block is still audited.
            validator: Courseforge.router.inter_tier_gates.BlockPageObjectivesValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: block
              on_error: warn
            description: Phase 3 inter-tier — verify outline-tier Blocks reference the page's declared objectives

          - gate_id: outline_source_refs
            validator: Courseforge.router.inter_tier_gates.BlockSourceRefValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_error: warn
            description: Phase 3 inter-tier — verify outline-tier source_ids resolve against the DART staging manifest

          # Worker W7: assessment_item payload-shape gate. Filters
          # blocks[] to block_type == "assessment_item" and asserts
          # distractors[] (>=2) + correct_answer_index (>=0, <
          # len(distractors)) + per-distractor text (non-empty) +
          # optional misconception_ref pattern match. Pre-W7 the
          # outline-tier per-block JSON schema required only stem +
          # answer_key, so a model could ship a "valid" assessment_item
          # with one (or zero) distractor(s); this gate closes that
          # regression class end-to-end. The forward-compat
          # misconception_ref linkage stays optional (chunk ->
          # misconception grounding lands in a separate plan post-W9).
          - gate_id: outline_assessment_item_payload
            validator: lib.validators.assessment_item_payload.BlockAssessmentItemPayloadValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            description: Worker W7 — verify outline-tier assessment_item Blocks carry distractors[] (>=2) + correct_answer_index pointing at a valid distractor.

          # Phase 4 Wave N1 Subtask 11: SHACL parallel of the four
          # outline-tier Block validators above. Validates outline-tier
          # Block JSON-LD against schemas/context/courseforge_v1.shacl.ttl
          # (BlockShape + TouchShape + the rest of the multi-shape
          # graph). Severity is intentionally `warning` so the four
          # Python gates above stay authoritative during the PoC
          # window; the SHACL output is informational and surfaces
          # richer diagnostics (sh:sourceShape, sh:sourceConstraintComponent)
          # for free per sub-plan §9.2.
          - gate_id: outline_shacl
            validator: lib.validators.courseforge_outline_shacl.CourseforgeOutlineShaclValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: Phase 4 PoC SHACL parallel of outline-tier Block validators. Informational; Python gates remain authoritative.

          # Phase 4 Wave N2 Subtask 17: three embedding-tier
          # validators wired in alongside the structural Python +
          # SHACL gates above. Each validator embeds a per-block
          # textual surface and computes pair-wise cosine similarity
          # against a related surface (objective statements / concept
          # definitions / paraphrase roundtrip), emitting
          # action="regenerate" when the cosine drops below the
          # validator's threshold. Severity is intentionally `warning`
          # so the structural gates stay authoritative during the PoC
          # window — the embedding signals are *additive*: they catch
          # semantic drift the structural validators can't detect (an
          # objective_id that resolves but the assessment doesn't
          # actually probe; a CURIE that anchors textually but the
          # example doesn't illustrate; an objective statement that
          # parses cleanly but is unstable under paraphrase). All
          # three degrade gracefully when sentence-transformers extras
          # are not installed (single warning issue, passed=True).
          - gate_id: outline_objective_assessment_similarity
            validator: lib.validators.objective_assessment_similarity.ObjectiveAssessmentSimilarityValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: Phase 4 PoC embedding-tier check that assessment_item Blocks semantically align with their declared objective_ids.

          - gate_id: outline_concept_example_similarity
            validator: lib.validators.concept_example_similarity.ConceptExampleSimilarityValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: Phase 4 PoC embedding-tier check that example Blocks semantically align with their declared concept_refs / curies.

          - gate_id: outline_objective_roundtrip_similarity
            validator: lib.validators.objective_roundtrip_similarity.ObjectiveRoundtripSimilarityValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: Phase 4 PoC embedding-tier paraphrase-roundtrip stability check on objective Blocks. Skipped when no paraphrase_fn / router is wired.

          # Phase 4 Subtask 28: BERT ensemble disagreement gate. Wraps
          # the 3-member BloomBertEnsemble (kabir5297 Bloom classifier,
          # distilbert SST-2, DeBERTa-v3 NLI) and emits regenerate-
          # action GateIssues when the ensemble winner disagrees with
          # an objective / assessment_item Block's declared bloom_level
          # OR when ensemble dispersion (entropy of normalised votes)
          # exceeds the configured threshold (default 0.7). Severity
          # warning per the Phase 4 PoC contract — structural Python
          # + SHACL + embedding gates above stay authoritative; the
          # ensemble signal is *additive*. Degrades gracefully when
          # transformers extras are missing (single warning issue,
          # passed=True) — opt-in fail-closed via
          # TRAINFORGE_REQUIRE_BERT_ENSEMBLE=true.
          - gate_id: outline_bloom_classifier_disagreement
            validator: lib.validators.bloom.classifier_disagreement.BloomClassifierDisagreementValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: Phase 4 PoC BERT-ensemble disagreement check on outline-tier objective / assessment_item Blocks. Informational; structural gates remain authoritative.

          # GPT Feedback v2 Wave 1.7 W1.7.C: tri-axis (NLI statement
          # entailment / Bloom-gap≥2 / action-verb synonym presence)
          # per-block-per-objective delivery gate. Fires across 6 of
          # 16 block_types (concept / example / explanation /
          # assessment_item / activity / self_check_question). Each
          # block_type has its own entailment threshold (see
          # ``_PER_BLOCK_TYPE_ENTAILMENT_FLOOR`` in the validator
          # module) — the 0.55 floor on assessment_item matches the
          # existing ``outline_objective_assessment_similarity`` gate
          # for symmetry. Day-1 severity warning; promotion to critical
          # deferred until per-block-type calibration data lands
          # (Wave 3 follow-up). Graceful-degrades to a warning issue
          # ``passed=True`` when the NLI loader (W2.F prerequisite)
          # returns None, so CPU-only dev boxes don't fail closed.
          # TODO(calibration) — IB3 FAST-FLIP: this validator now carries the
          # IB3.2 verb-triple EQUALITY axis (BLOCK_OBJECTIVE_VERB_TRIPLE_MISMATCH,
          # behind ED4ALL_ALIGNMENT_VERB_TRIPLE) — the framework keystone (the
          # single load-bearing validity rule). Flip
          # BLOCK_OBJECTIVE_VERB_TRIPLE_MISMATCH to critical (severity: critical,
          # on_fail: block) after ONE >=2-corpus FP measurement clears (NOT the
          # multi-wave deferral the other gates take). A Create objective checked
          # by a recall MCQ is a malformed block, not a style choice — the cost
          # of a false NEGATIVE (shipping a mis-aligned block) exceeds the cost
          # of a false positive here, inverting the usual warning-first
          # conservatism. Evidence target: verb-triple mismatch-rate measured on
          # >=2 corpora with manual FP audit; the per-pair verb_triple_status on
          # every alignment entry makes the audit replayable. The fast-flip also
          # waits until IB1's interaction slot is populated (else the verb signal
          # is prose-heuristic, not the slot-addressable interaction verb).
          - gate_id: outline_block_objective_delivery
            validator: lib.validators.block_objective_delivery.BlockObjectiveDeliveryValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: Wave 1.7 W1.7.C — tri-axis (NLI entailment / Bloom-gap≥2 / action-verb synonym) per-block-per-objective delivery check on outline-tier Blocks; IB3.2 adds the verb-triple EQUALITY axis behind ED4ALL_ALIGNMENT_VERB_TRIPLE. Informational; structural gates remain authoritative.

          # GPT-feedback W2-W7 wave: five new gates wired warning-only at
          # both seams (inter_tier + post_rewrite). Promoted to critical
          # in a follow-up commit once alignment-rate signal stabilises
          # in CI. All five operate on Block-shape inputs so both seams
          # carry symmetric coverage.
          #
          # Wave-3 W3.A note: ``outline_assessment_retrieval_grounding``
          # carries a calibration-gated severity flip implemented
          # validator-side (see
          # ``lib/governance/calibration_gate.py::resolve_severity_flip``
          # + ``lib/validators/assessment_retrieval_grounding.py``).
          # The YAML severity stays ``warning`` so this file stays
          # static + auditable; the validator dynamically lifts the
          # ``NO_SOURCE_ATTRIBUTION`` GateIssue to ``critical`` when the
          # ``answerability_alignment_rate`` calibration signal clears
          # the 0.85 floor on the most recent W2.B calibration report.
          # Captured per build via the ``severity_flip_applied`` /
          # ``severity_flip_deferred`` decision events.
          - gate_id: outline_assessment_retrieval_grounding
            validator: lib.validators.assessment_retrieval_grounding.AssessmentRetrievalGroundingValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: W2 — answerability gate; every assessment_item Block answer must overlap a referenced source chunk above the Jaccard floor (default 0.30).

          - gate_id: outline_distractor_plausibility
            validator: lib.validators.distractor_plausibility.DistractorPlausibilityValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: W3b — CPU-only Jaccard distinctness gate; distractors must not be near-duplicates of the answer key or of one another (rewrite[2] regression class).

          - gate_id: outline_distractor_misconception_alignment
            validator: lib.validators.distractor_misconception_alignment.DistractorMisconceptionAlignmentValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: W3a — embedding-gated alignment between distractor text and the declared misconception_ref (cosine when extras loaded; Jaccard fallback otherwise).

          - gate_id: outline_distractor_structural
            validator: lib.validators.distractor_structural.DistractorStructuralValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: W2.C — exactly-one-correct check on Trainforge ``choices[]`` shape + distractor-not-entailed-by-source Jaccard floor (default 0.70). Symmetric to AssessmentRetrievalGroundingValidator's correct-answer-grounding gate.

          # a6d6291b follow-up — numeric-value distractor-equivalence gate.
          # Token-Jaccard distinctness can't catch a distractor mathematically
          # EQUAL to the correct answer (4/6 vs 2/3 → Jaccard 0.0 → "distinct"),
          # so an equivalent-form distractor (a second correct answer) ships.
          # This gate parses each option to a fractions.Fraction and fails any
          # distractor equal in value to the key. Scope-limited: non-numeric
          # MCQs skip (pass). action=regenerate is advisory at warning.
          # TODO(calibration): promote to critical after a live run confirms
          # the numeric-parse + correct-marker extraction on real 7B output.
          - gate_id: outline_assessment_numeric_equivalence
            validator: lib.validators.assessment_numeric_equivalence.AssessmentNumericEquivalenceValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: a6d6291b — numeric-value distractor-equivalence gate; a distractor equal in VALUE to the correct answer (4/6 == 2/3) is a second correct answer that token-Jaccard distinctness can't detect. Scope-limited to numeric/fraction MCQs.

          - gate_id: outline_padded_distractor
            validator: lib.validators.padded_distractor.PaddedDistractorValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: block
              on_error: fail_closed
            description: W2.D — regression-net regex gate against the canonical pre-W2.D padded-distractor fallback ('A concept unrelated to ...'). Critical-from-start; outline-tier action=regenerate so the rewrite tier re-rolls the block before publication.

          - gate_id: outline_instructional_depth
            validator: lib.validators.instructional_depth.InstructionalDepthValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: W7 — per-page pedagogical-density floors (concepts / examples-per-concept / explanation-tokens-per-concept).

          - gate_id: outline_bloom_structural_enforcement
            validator: lib.validators.bloom.structural_enforcement.BloomStructuralEnforcementValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: W6 — deterministic regex-on-stem structural enforcement; assessment_item stems must match the declared bloom_level's clause/verb/marker rules.

          # IB3.4 — anchored-rubric presence on Evaluate/Create scored blocks.
          # Warning day-1; no-ops when ED4ALL_ALIGNMENT_VERB_TRIPLE is unset.
          # TODO(calibration) — IB3 FAST-FLIP: companion to the keystone
          # verb-triple gate (see the outline_block_objective_delivery marker
          # above). Flips critical after ONE >=2-corpus FP measurement, NOT the
          # multi-wave deferral the other gates take — a Create objective
          # checked by a recall MCQ is a malformed block, so the false-negative
          # cost exceeds the false-positive cost.
          - gate_id: outline_anchored_rubric
            validator: lib.validators.alignment.anchored_rubric.AnchoredRubricValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: IB3.4 — Evaluate/Create scored blocks must ship an exemplar-anchored rubric published before the task. Warning day-1; no-ops when ED4ALL_ALIGNMENT_VERB_TRIPLE is unset.

          # IB3.5 — triangle completeness (every objective has >=1 activity +
          # >=1 band-aligned assessment). Warning day-1; no-ops when the flag
          # is unset. TODO(calibration) — IB3 FAST-FLIP: see the
          # outline_anchored_rubric marker above (keystone verb-triple gate
          # flips critical after ONE >=2-corpus FP measurement).
          - gate_id: outline_triangle_completeness
            validator: lib.validators.alignment.triangle_completeness.TriangleCompletenessValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: IB3.5 — every objective has >=1 activity AND >=1 band-aligned assessment (the complete constructive-alignment triangle). Warning day-1; no-ops when ED4ALL_ALIGNMENT_VERB_TRIPLE is unset.

          # NOTE — render-dependent IB4.5 / IB6 gates (udl_coverage,
          # anatomy_slot_presence, interaction_feedback, block_quality_rubric,
          # qa_checklist) are INTENTIONALLY ABSENT from the outline-tier
          # inter_tier_validation phase. They measure fields that exist only
          # after the rewrite/render stage (UDL n_representations derives from
          # rendered HTML tags; the IB1 anatomy interaction/feedback/transition
          # slots, the (verb·level·knowledge-type) Bloom chip, and the rendered
          # interaction/feedback HTML are all rewrite-tier emit), so against
          # outline-tier dict blocks they blanket-fail every block as a false
          # positive (course-a-calib calibration run, 2026-06-24: udl_coverage
          # 50/50 UDL_SINGLE_REPRESENTATION, qa_checklist 50/50 QA3_NO_BLOOM_TAG,
          # block_quality_rubric 2664, interaction_feedback 2146,
          # anatomy_slot_presence 74). They remain wired at
          # post_rewrite_validation, where the rendered fields exist and the
          # signal is real.
          # IB6.4 cognitive-load: reads the BODY text (content), present at
          # outline tier → meaningful pre-render. No-op when the keystone flag
          # ED4ALL_BLOCK_QUALITY_RUBRIC is unset (byte-stable). Warning-day-1;
          # TODO(calibration) — the hard-gate critical flip is DEFERRED until
          # the anchored 0-3 scale is calibrated on >=2 corpora.
          - gate_id: block_cognitive_load
            validator: lib.validators.content.BlockCognitiveLoadValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: IB6.4 — per-block <=~200-char / <=4-idea-chunk body ceiling (D2). Warning day-1; TODO(calibration).

          # IB7.5b — spacing-aware retrieval-presence floor: every
          # content-bearing module must carry >=1 low-stakes retrieval block
          # (self_check_question / reflection_prompt) SPACED from (not the
          # first block on) the content page. Pure block-type / page-grouping,
          # NO embeddings. action=regenerate on miss.
          # TODO(calibration) — flip MODULE_NO_RETRIEVAL / RETRIEVAL_UNSPACED to
          # critical after a >=2-corpus FP measurement (WS3/W4 deferred-flip
          # pattern; IB3 is the single documented fastest-flip exception, this
          # is NOT IB3).
          - gate_id: retrieval_presence
            validator: lib.validators.retrieval_presence.RetrievalPresenceValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: IB7.5b — >=1 spaced low-stakes retrieval block per content-bearing module. Warning day-1; deferred critical-flip.

          # FR-COURSE-02 — pedagogical block-sequence-order floor. Flags
          # worked_example(B05)->guided-practice(B08) out of order, a check
          # (B07) massed against same-objective exposition, and a scenario
          # (B09) opening a TO module. Consumes inputs['blocks']; runs warning-
          # day-1 regardless of any flag (mirrors retrieval_presence).
          # TODO(calibration) — flip these three codes to critical after a
          # >=2-corpus FP measurement (WS3/W4 deferred-flip pattern; IB3 is the
          # single documented fastest-flip exception, this is NOT IB3).
          - gate_id: block_sequence_order
            validator: lib.validators.block_sequence_order.BlockSequenceOrderValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: FR-COURSE-02 — worked-example->guided fade gradient, check spacing, scenario-opens-TO. Warning day-1; deferred critical-flip.

          # IB7.6c — per-type Bloom-range ceiling enforcement (advisory->gate
          # promotion of block_catalog.yaml's bloom_ceiling). Flags a block
          # whose declared/observed target Bloom exceeds its type's stretch
          # ceiling. action=regenerate on miss.
          # TODO(calibration) — flip BLOCK_BLOOM_OVER_CEILING to critical after
          # a >=2-corpus FP measurement (WS3/W4 deferred-flip pattern; IB3 is
          # the single documented fastest-flip exception, this is NOT IB3).
          - gate_id: bloom_type_range
            validator: lib.validators.bloom_type_range.BloomTypeRangeValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: IB7.6c — per-type Bloom-range ceiling (block Bloom <= type bloom_ceiling). Warning day-1; deferred critical-flip.

      - name: content_generation_rewrite
        agents: [content-generator]
        # NOTE: parallel/batch_by intentionally disabled. The handler
        # ``MCP/tools/pipeline_tools.py::_run_content_generation_rewrite``
        # iterates ``for week_num in range(1, duration_weeks + 1)``
        # internally with no ``week_range`` slicing, so dispatching N
        # parallel tasks would emit N² LLM calls. Re-enable only after
        # the handler accepts a ``week_range`` kwarg.
        parallel: false
        max_concurrent: 1
        depends_on: [inter_tier_validation]
        # Local-7B authoring of a multi-block course rewrite tier (per-block
        # CURIE-preservation retries on a slow local model) needs a wide
        # ceiling; these are MAX caps (the phase finishes as soon as the
        # single rewrite task returns), so a long timeout never slows a fast
        # cloud run — it only stops the slow local path from being killed
        # mid-rewrite by the default 30-min batch cap.
        timeout_minutes: 240
        batch_timeout_minutes: 240
        description: Phase 3 — rewrite-tier HTML emit consuming validated Block outlines
        enabled_when_env: "COURSEFORGE_TWO_PASS=true"

        inputs_from:
          - param: blocks_validated_path
            source: phase_outputs
            phase: inter_tier_validation
            output: blocks_validated_path
          - param: project_id
            source: phase_outputs
            phase: objective_extraction
            output: project_id
          - param: source_module_map_path
            source: phase_outputs
            phase: source_mapping
            output: source_module_map_path
          - param: staging_dir
            source: phase_outputs
            phase: staging
            output: staging_dir
          - param: duration_weeks_explicit
            source: workflow_params
            key: duration_weeks_explicit
          # Worker W3 (validation-wiring fix): thread workflow_type +
          # rehydrate the W2-persisted outline sidecars so the rewrite
          # phase can resolve the post_rewrite_validation gate chain
          # AND pass per-block source_chunks + objectives into the
          # remediation loop instead of the legacy [] defaults.
          - param: workflow_type
            source: workflow_params
            key: workflow_type
          - param: outline_chunks_path
            source: phase_outputs
            phase: content_generation_outline
            output: outline_chunks_path
          - param: outline_objectives_path
            source: phase_outputs
            phase: content_generation_outline
            output: outline_objectives_path

        outputs:
          - content_paths
          - page_paths
          - content_dir
          - blocks_final_path

        validation_gates:
          # Moved from the legacy content_generation phase — the
          # rewrite tier is where final HTML grounding is verifiable.
          # 2026-05-14 TEMP: severity flipped critical → warning so a
          # corpus of pure-objective blocks (each authored as a short
          # `<li>` item < NON_TRIVIAL_WORD_FLOOR=30 words) doesn't
          # fail the gate's AGGREGATE_EMPTY_PAGES check, which expects
          # paragraph-shaped content.
          # 2026-06-10 STILL WARNING (revert deferred): unlike the
          # sibling Block*Validator flips, this gate's revert condition
          # is NOT "honor escalation_marker" — ContentGroundingValidator
          # consumes rendered HTML page_paths, not the Block list, so the
          # escalation-marker hook does not reach it. The original corpus
          # condition stands: revert to critical only when the calibration
          # corpus carries concept/example/explanation blocks with
          # substantive (>= NON_TRIVIAL_WORD_FLOOR) prose so the
          # AGGREGATE_EMPTY_PAGES check is no longer tripped by a
          # legitimately objective-only corpus.
          - gate_id: content_grounding
            validator: lib.validators.content_grounding.ContentGroundingValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: block
              on_error: fail_closed
            description: Verify every non-trivial paragraph in rewrite-tier HTML is grounded in DART source (Phase 3 carry-over)

      # Phase 3.5 Subtask 10: post-rewrite validation phase. Runs the
      # same four Block-input validators from inter_tier_validation
      # against the rewrite-tier blocks_final_path, so a rewrite-tier
      # HTML emit that drops a CURIE / content_type / objective_ref /
      # source_id silently is caught before packaging consumes it.
      # Validators are shape-discriminating (Wave A Subtasks 6-9):
      # rewrite-tier Block.content is an HTML string while outline-tier
      # Block.content is a dict; the same adapters handle both via
      # isinstance(content, dict | str) dispatch.
      - name: post_rewrite_validation
        agents: []
        parallel: false
        max_concurrent: 1
        depends_on: [content_generation_rewrite]
        timeout_minutes: 5
        description: Phase 3.5 — re-run inter-tier validators on rewrite-tier blocks
        enabled_when_env: "COURSEFORGE_TWO_PASS=true"

        inputs_from:
          - param: blocks_final_path
            source: phase_outputs
            phase: content_generation_rewrite
            output: blocks_final_path
          - param: project_id
            source: phase_outputs
            phase: objective_extraction
            output: project_id

        outputs:
          - blocks_validated_path
          - blocks_failed_path

        validation_gates:
          # 2026-06-10 REVERTED critical (was: 2026-05-15 TEMP critical ->
          # warning for the post-rewrite content-quality gates that fired
          # on a degenerate all-objective corpus — the post-rewrite
          # analogue of the 2026-05-14 outline-tier flips). The TEMP
          # comment carried an OR revert condition ("...or when the
          # validators honor escalation_marker"); the escalation_marker
          # arm is now satisfied — the Block*Validator adapters skip ONLY
          # marker + EMPTY tombstones via
          # inter_tier_gates._is_unshipped_escalation_tombstone (the
          # packager ship-exclusion predicate); marker + content salvaged
          # blocks stay on the audit path.
          - gate_id: rewrite_curie_anchoring
            validator: Courseforge.router.inter_tier_gates.BlockCurieAnchoringValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: block
              on_error: warn
            description: Phase 3.5 post-rewrite — verify rewrite-tier Blocks anchor on a CURIE per §3

          - gate_id: rewrite_content_type
            validator: Courseforge.router.inter_tier_gates.BlockContentTypeValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: block
              on_error: warn
            description: Phase 3.5 post-rewrite — verify rewrite-tier Block content_type stays in the canonical 8-value enum

          # 2026-06-10 REVERTED critical (was: 2026-05-15 TEMP critical ->
          # warning, post-rewrite analogue of outline_page_objectives).
          # Revert condition satisfied: validators honor escalation_marker.
          - gate_id: rewrite_page_objectives
            validator: Courseforge.router.inter_tier_gates.BlockPageObjectivesValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: block
              on_error: warn
            description: Phase 3.5 post-rewrite — verify rewrite-tier Blocks reference the page's declared objectives

          - gate_id: rewrite_source_refs
            validator: Courseforge.router.inter_tier_gates.BlockSourceRefValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_error: warn
            description: Phase 3.5 post-rewrite — verify rewrite-tier source_ids resolve against the DART staging manifest

          # Worker W7: rewrite-tier symmetric mirror of the
          # outline_assessment_item_payload gate at the inter-tier
          # seam. Scrapes <li data-cf-distractor-index="N"> siblings
          # out of the rewrite-tier HTML and asserts >=2 entries with
          # contiguous 0-based indices and non-empty body text per
          # <li>. Closes the W7 regression class against rewrite-tier
          # HTML emit that drops a distractor silently.
          - gate_id: rewrite_assessment_item_payload
            validator: lib.validators.assessment_item_payload.BlockAssessmentItemPayloadValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            description: Worker W7 — verify rewrite-tier assessment_item HTML carries >=2 <li data-cf-distractor-index='N'> siblings with contiguous 0-based indices.

          # Followup §3.2 (plans/qwen7b-courseforge-fixes-2026-05-followup.md):
          # HTML-shape sentinel that closes the JSON-wrapped-emit
          # regression class observed on Qwen-2.5-7B-Q4. Critical
          # severity so the workflow halts on failure; the per-block
          # action="regenerate" still drives the rewrite-tier
          # remediation loop via the router exhausting
          # COURSEFORGE_REWRITE_REGEN_BUDGET (defaults to 10) before
          # the gate result reaches the executor.
          # 2026-06-10 REVERTED critical (was: 2026-05-15 TEMP critical ->
          # warning; the all-objective corpus emitted bare <li> objective
          # blocks that tripped the per-block-type required-attr / body-
          # fragment checks). Revert condition satisfied:
          # RewriteHtmlShapeValidator now skips ONLY marker + EMPTY
          # tombstones via rewrite_html_shape._is_unshipped_escalation_tombstone
          # (the packager ship-exclusion predicate), so escalated EMPTY
          # blocks no longer trip the shape sentinel; a marker + content
          # salvaged bare-<li> block is still audited.
          # IB5.7: this gate ALSO carries the per-block B04/B06 a11y-shape arms
          # (multimedia captions/AD/transcript/controls stack + diagram
          # long-desc/data-table), gated in-validator on new_block_types_enabled
          # (ED4ALL_NEW_BLOCK_TYPES) and emitted at WARNING severity
          # (REWRITE_IB5_A11Y_CONTRACT) so the existing critical parse-fail /
          # I6 behavior is untouched. TODO(calibration) — flip the IB5
          # multimedia/diagram contracts to critical after a >=2-corpus FP
          # measurement (see _check_ib5_a11y_shape in the validator).
          - gate_id: rewrite_html_shape
            validator: lib.validators.rewrite_html_shape.RewriteHtmlShapeValidator
            severity: critical
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: block
              on_error: warn
            description: Followup §3.2 — verify rewrite-tier emit is a bare HTML body fragment (not JSON-wrapped, markdown-fenced, or unbalanced) with all required data-cf-* attributes per block_type.

          # Followup §3.3: sentence-level source-grounding sentinel
          # complementing the Wave 31 ContentGroundingValidator
          # (which walks ancestor chain for data-cf-source-ids
          # presence). This gate asserts the paragraph TEXT itself
          # paraphrases (cosine >= 0.45) at least one source chunk
          # substring; >=60% of non-trivial sentences must trace.
          # Embedding-deps fallback per Phase 4 contract: missing
          # extras -> warning EMBEDDING_DEPS_MISSING with passed=True;
          # strict mode via TRAINFORGE_REQUIRE_EMBEDDINGS=true flips
          # to critical.
          - gate_id: rewrite_source_grounding
            validator: lib.validators.rewrite_source_grounding.RewriteSourceGroundingValidator
            severity: warning                  # W4: DEMOTED from critical — cosine is now a cheap pre-filter; NLI block_prose_entailment is the critical text-trace enforcer (after §4 calibration). Cosine 0.45 passes plausible-but-fabricated on-topic prose; NLI catches it.
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn                    # W4: was on_fail: block (implicit) — now advisory
              on_error: warn                   # W4: was fail_closed — cosine degrade is non-fatal now
            config:
              thresholds:
                min_grounding_cosine: 0.45
                min_grounded_sentence_rate: 0.60
            description: "W4 — cosine paraphrase pre-filter (DEMOTED to warning). NLI block_prose_entailment is the critical text-trace enforcer. Cosine catches gross off-topic drift cheaply (no NLI load); NLI catches on-topic fabrication."

          # W4 — full-prose NLI entailment of rewrite-tier block prose against
          # its cited source chunk(s). The text-trace counterpart to the
          # (now-demoted) rewrite_source_grounding cosine gate AND the broadened
          # counterpart to claim_support (which scores only curated key_claims).
          # Reuses lib/retrieval/groundedness.py::score_groundedness (windowed
          # scorer-v2). Day-1 SHADOW (warning): computes + captures, does not
          # gate. Graceful-degrade: NLI deps absent -> warning NLI_DEPS_MISSING
          # passed=True; TRAINFORGE_REQUIRE_EMBEDDINGS=true -> fail-closed.
          # TODO(calibration): promote to critical after
          # state/calibration/block_prose_entailment_calibration.json
          # decision:promote_critical — flip is severity: critical,
          # behavior.on_fail: block, config.shadow: false, and
          # config.thresholds.min_block_entailment_rate: <CALIBRATED>. The
          # calibration run needs a live local-7B synthesis pass (DEFERRED);
          # the orchestrator runs §4 calibration then flips. Promote
          # claim_support to critical in the SAME flip (shares the floor + the
          # now-fixed source_chunks builder).
          - gate_id: block_prose_entailment
            validator: lib.validators.block_prose_entailment.BlockProseEntailmentValidator
            severity: warning                  # SHADOW day-1 -> critical post-calibration (§4)
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn                    # SHADOW -> block post-calibration
              on_error: fail_closed
            config:
              shadow: true                     # forces emitted issues to warning-severity during calibration (§4.3)
              thresholds:
                min_block_entailment_rate: 0.60
                entailment_floor: 0.70
                contradiction_floor: 0.50
                max_contradicted_rate: 0.05
            description: "W4 — full-block-prose NLI entailment vs cited chunks (windowed scorer-v2). SHADOW until §4 calibration pins the floor, then critical."

          # Numeric-literal grounding — the fabrication control for NUMERIC /
          # math content that the number-blind NLI gate cannot provide
          # (content-block-quality iters 5/5b). DeBERTa-v3-mnli scores a
          # fabricated worked-example input ABOVE every grounded math claim,
          # and groundedness._is_computational EXEMPTS such claims, so
          # block_prose_entailment gives no numeric fabrication protection.
          # This gate cross-checks each prose fraction's num/denom pair against
          # the cited source under OCR-tolerant containment. Day-1 SHADOW
          # (warning): measured clean separation on the real sample-course-a
          # corpus. TODO(calibration): promote to critical (config.shadow:
          # false, severity: critical, behavior.on_fail: regenerate) after a
          # ≥2-corpus FP-rate measurement; if a corpus shows legitimate
          # computed-result false-positives, flip min_absent_fractions to a
          # source_absent_ratio floor (the ratio is on every decision event).
          - gate_id: numeric_literal_grounding
            validator: lib.validators.numeric_literal_grounding.NumericLiteralGroundingValidator
            severity: warning                  # SHADOW day-1 -> critical post-calibration
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn                    # SHADOW -> regenerate post-calibration
              on_error: warn
            config:
              shadow: true                     # forces emitted issues to warning-severity during calibration
              thresholds:
                min_absent_fractions: 1
            description: "Numeric-literal grounding — cross-check prose fractions vs cited source (OCR-tolerant). The fabrication control for math content the number-blind NLI gate cannot provide. SHADOW until ≥2-corpus calibration, then critical."

          # Phase 4 Wave N1 Subtask 12: SHACL parallel of the four
          # rewrite-tier Block validators above. Distinct gate_id
          # (``rewrite_shacl`` vs the inter-tier ``outline_shacl``) so
          # downstream decision-event filtering can stratify the two
          # validation seams. The validator's _coerce_block_payloads
          # handles dict and HTML-string entries via the
          # _extract_jsonld_blocks helper (mirrors the shape-dispatch
          # in Courseforge/router/inter_tier_gates.py for rewrite-tier
          # input). Severity warning per sub-plan §9 PoC contract.
          - gate_id: rewrite_shacl
            validator: lib.validators.courseforge_outline_shacl.CourseforgeOutlineShaclValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: Phase 4 PoC SHACL parallel of rewrite-tier Block validators. Informational; Python gates remain authoritative.

          # Phase 4 Wave N2 Subtask 18: symmetric mirror of the three
          # embedding-tier validators added at the inter-tier seam
          # (Subtask 17). Distinct gate_id prefix (``rewrite_*`` vs the
          # inter-tier ``outline_*``) so downstream decision-event
          # filtering can stratify the two validation seams. Each
          # validator's shape-dispatch handles both outline-tier dict
          # content and rewrite-tier HTML-string content via the
          # surface extractors documented in
          # ``lib/validators/objective_assessment_similarity.py`` etc.
          # Severity warning per Wave N2 PoC contract — embedding
          # signals stay informational while the structural Python +
          # SHACL gates remain authoritative.
          - gate_id: rewrite_objective_assessment_similarity
            validator: lib.validators.objective_assessment_similarity.ObjectiveAssessmentSimilarityValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: Phase 4 PoC embedding-tier check that rewrite-tier assessment_item Blocks semantically align with their declared objective_ids.

          - gate_id: rewrite_concept_example_similarity
            validator: lib.validators.concept_example_similarity.ConceptExampleSimilarityValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: Phase 4 PoC embedding-tier check that rewrite-tier example Blocks semantically align with their declared concept_refs / curies.

          - gate_id: rewrite_objective_roundtrip_similarity
            validator: lib.validators.objective_roundtrip_similarity.ObjectiveRoundtripSimilarityValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: Phase 4 PoC embedding-tier paraphrase-roundtrip stability check on rewrite-tier objective Blocks. Skipped when no paraphrase_fn / router is wired.

          # Phase 4 Subtask 28: symmetric mirror of the BERT-ensemble
          # disagreement gate added at the inter-tier seam (also
          # Subtask 28). Distinct gate_id prefix (``rewrite_*`` vs the
          # inter-tier ``outline_*``) so downstream decision-event
          # filtering can stratify the two validation seams. The
          # validator's text-extraction helper handles both outline-
          # tier dict content (statement / text / key_claims) and
          # rewrite-tier HTML-string content (HTML strip) via the
          # same shape-dispatch path. Severity warning per the Phase 4
          # PoC contract.
          - gate_id: rewrite_bloom_classifier_disagreement
            validator: lib.validators.bloom.classifier_disagreement.BloomClassifierDisagreementValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: Phase 4 PoC BERT-ensemble disagreement check on rewrite-tier objective / assessment_item Blocks. Informational; structural gates remain authoritative.

          # GPT Feedback v2 Wave 1.7 W1.7.C: post-rewrite mirror of the
          # outline-seam tri-axis gate. Same shape-dispatch handles
          # rewrite-tier HTML-string content vs. outline-tier dict
          # content. Severity warning per the Day-1 contract; W1.7.D
          # will wire the per-axis remediation suffix into the
          # rewrite-tier regen loop so a Wave-1.7 failure on attempt N
          # injects a per-axis directive on attempt N+1.
          # TODO(calibration) — IB3 FAST-FLIP: this validator now carries the
          # IB3.2 verb-triple EQUALITY axis (BLOCK_OBJECTIVE_VERB_TRIPLE_MISMATCH,
          # behind ED4ALL_ALIGNMENT_VERB_TRIPLE) — the framework keystone (the
          # single load-bearing validity rule). Flip
          # BLOCK_OBJECTIVE_VERB_TRIPLE_MISMATCH to critical (severity: critical,
          # on_fail: block) after ONE >=2-corpus FP measurement clears (NOT the
          # multi-wave deferral the other gates take). A Create objective checked
          # by a recall MCQ is a malformed block — the false-negative cost
          # exceeds the false-positive cost, inverting the usual warning-first
          # conservatism. Per-pair verb_triple_status makes the FP audit
          # replayable; the flip also waits until IB1's interaction slot is
          # populated (else the verb signal is prose-heuristic).
          - gate_id: rewrite_block_objective_delivery
            validator: lib.validators.block_objective_delivery.BlockObjectiveDeliveryValidator
            severity: warning
            threshold:
              max_critical_issues: 0
            behavior:
              on_fail: warn
              on_error: warn
            description: Wave 1.7 W1.7.C — tri-axis post-rewrite per-block-per-objective delivery check; IB3.2 adds the verb-triple EQUALITY axis behind ED4ALL_ALIGNMENT_VERB_TRIPLE. Mirrors the outline seam against rewrite-tier Blocks.

          # GPT Feedback v2 Wave 2 W2.F: per-block-per-claim NLI
          # entailment gate. Fans out every key_claims[] entry against
          # the block's cited source chunks (Wave 1.5 W1.5.A structured
          # List[{claim, source_chunk_ids[]}] shape with back-compat for
          # the legacy List[str] shape). Skips assessment_item /
          # objective / chrome / recap (per-stem cosine + chrome
          # scaffolding skip set). Graceful-degrade contract: when the
