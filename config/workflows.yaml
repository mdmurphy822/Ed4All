              on_error: warn
            description: IB3.4 — Evaluate/Create scored blocks must ship an exemplar-anchored rubric published before the task (post-rewrite). Warning day-1; no-ops when ED4ALL_ALIGNMENT_VERB_TRIPLE is unset.

          # IB3.5 — triangle completeness (post-rewrite mirror). Warning day-1;
          # no-ops when the flag is unset. TODO(calibration) — IB3 FAST-FLIP:
          # see the rewrite_anchored_rubric marker above (keystone verb-triple
          # gate flips critical after ONE >=2-corpus FP measurement).
          - gate_id: rewrite_triangle_completeness
