<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask the Course</title>
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/components/components.css">
  <link rel="stylesheet" href="/learn/learn.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header>
    <p class="brand">Ask the Course</p>
  </header>
  <main id="main">
    <h1>Ask the course a question</h1>

    <form id="ask-form" novalidate>
      <div class="field" id="course-field">
        <label for="course-sel">Course</label>
        <select id="course-sel" name="course" required>
          <option value="">Loading courses&hellip;</option>
        </select>
      </div>

      <div class="field">
        <label for="q-in">Your question</label>
        <textarea id="q-in" name="query" rows="3" required
                  placeholder="e.g. What is a vector store?"></textarea>
      </div>

      <button type="submit" id="ask-btn">Ask</button>
    </form>

    <!-- The ONE polite live region. Status + arrival messages only. -->
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <!-- Visual-only "thinking" reassurance during the ask window. The ring +
         elapsed counter are BOTH aria-hidden decoration (SR users get the
         single polite status announcement above, no per-second chatter). -->
    <div class="thinking" aria-hidden="true">
      <span id="thinking-ring" aria-hidden="true"></span>
      <span id="elapsed" class="elapsed" aria-hidden="true"></span>
    </div>

    <!-- Server-rendered answer fragment lands here. -->
    <div id="answer-region" aria-busy="false"></div>

    <!-- Quizzes surface (L1) — lists the selected course's quizzes, loads one,
         renders items, grades server-side, shows per-item feedback + score. The
         quiz list + host use aria-live="polite" (NOT role=status) so the ONE
         role=status live region on the page stays the ask #status region; the
         graded-result region quiz.js injects into #quiz-host carries its own
         role=status only once a quiz is mounted (dynamic, not on the idle page). -->
    <section id="quizzes" aria-labelledby="quizzes-h">
      <h2 id="quizzes-h">Quizzes</h2>
      <p class="quiz-intro">
        Check your understanding with a quiz from the course selected above.
      </p>
      <button type="button" id="quiz-load-btn">Show quizzes</button>
      <!-- Quiz list / load-status. aria-live announces load + empty + error copy. -->
      <div id="quiz-list-region" aria-live="polite"></div>
      <!-- The active quiz (items + submit + graded result) mounts here. -->
      <div id="quiz-host"></div>
    </section>
  </main>

  <script type="module" src="/learn/learn.js"></script>
  <script type="module" src="/learn/quiz-panel.js"></script>
</body>
</html>
