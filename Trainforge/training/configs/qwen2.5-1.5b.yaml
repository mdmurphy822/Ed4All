# Wave 90 — default training config for the Qwen2.5-1.5B base.
# Loaded by ``Trainforge.training.configs.load_config("qwen2.5-1.5b")``.
# Course-level overrides may override any field; see TrainingConfig.

base_model: qwen2.5-1.5b
learning_rate: 2.0e-4
epochs: 3
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
max_seq_length: 2048
batch_size: 1
gradient_accumulation_steps: 4
warmup_ratio: 0.03
weight_decay: 0.01
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
# SFT program recipe (scratchpad/sft_data_program.md §C): bf16 LoRA is the
# default for the shipped 1.5B course-tutor. Flip to `true` to fall back to
# QLoRA (4-bit) on a memory-constrained box.
use_4bit: false
min_dpo_pairs: 50
dpo_preference_filter: editorial_or_misconception
dpo_fail_hard: true
seed: 42
# Per-epoch checkpoint retention for the downstream-probe selector.
save_total_limit: 3
completion_only_loss: true
verify_loss_mask: true
early_stopping_patience: 1
checkpoint_selection_metric: gold_keypoint_coverage
